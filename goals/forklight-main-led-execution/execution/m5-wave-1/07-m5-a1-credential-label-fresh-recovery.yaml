reviewRequirement:
  requiredJudges: 2
  reason: This changes secret-output filtering and Review/Integration authority; two different-view read-only Judges must inspect actual-value rejection and same-Judge immutability before Main Integration.
contract:
  outcome: From current source, deliver the accepted three-path Review Result change that allows credential labels without values, rejects actual secret-shaped values including a whitespace-delimited CLI value, and admits only an otherwise-valid historical label-only unsafe-content assignment to the existing one-shot same-Judge summary repair.
  presentation:
    summary: 重新从干净源码交付“字段名可说、真实值继续拦截”的三路径修复。
    language: zh-CN
  context:
    - Read AGENTS.md, specs/m5-product-graduation/work-items/credential-label-judge-repair/spec.md and goals/forklight-main-led-execution/evidence/m5-a1-credential-label-correction-loop-stop-decision-packet.md completely before editing. They are the sole accepted boundary.
    - The prior Task is immutable failure evidence. Its first Candidate included an out-of-scope handoff file and missed a whitespace-delimited CLI credential value. Its correction Workspace is unverified and must not be imported or treated as a Candidate.
    - Start from this fresh current-source Workspace. Implement the accepted behavior independently in exactly three writable paths; do not read old Task state or Workspace artifacts.
    - Ordinary new Review Results may name bare credential labels or CLI options. Actual provider token shapes, authorization values, password assignments, colon/equal credential assignments and a credential CLI option followed by whitespace plus an eight-or-more-character value remain unsafe.
    - Historical repair eligibility requires failed unsafe-content, a succeeded original Reviewer Task, no prior repair, exact ownership/private packet, complete success under the refined strict parser and presence of a known label.
    - Reuse the existing append-only, one-shot, same-frozen-Judge, read-only summary repair. The repair may change only summary; exact schemaVersion, Candidate Revision, disposition and every finding remain equal.
    - Return handoff only in the final Worker response. Do not create or modify any Goal, Spec, evidence, decision, progress, documentation or handoff file.
    - ForkLight serves one local developer. Add no checksum, content hash, lock, lease, version handshake, duplicate coordination state, multi-user or distributed behavior.
    - Never touch the live A1 Candidate/assignment, create a Judge, integrate, commit, push, reset, reclaim or edit Hub UI.
  inScope:
    - Refine Review Result credential detection from bare-name rejection to actual-value rejection with explicit safe-label recognition.
    - Reject the common CLI form where the credential option is followed by whitespace and an eight-or-more-character value.
    - Add narrow historical unsafe-content eligibility alongside unchanged overlong-summary eligibility in the existing repair lifecycle.
    - Generate kind-specific same-Judge repair instructions while preserving summary-only equality and frozen identity.
    - Reconcile either eligible repair kind idempotently and keep aggregation, fresh-Main and Integration gates truthful.
    - Add focused parser, historical-assignment, one-shot, identity, semantic-drift, restart and Integration-gate regressions in the single allowed test file.
  outOfScope:
    - Any path outside src/core/review-graph.ts, src/core/review-result-repair.ts and tests/review-graph.test.ts.
    - Handoff/evidence/Goal/Spec/docs files, old Task Workspace import, A1 Candidate rerun/edit, live MiniMax repair, new Graph/assignment/Judge, third/replacement Judge or reduced Judge requirement.
    - Arbitrary unsafe-content repair, silent redaction/truncation, weakening actual secret rejection, Store schema/entity, new CLI/MCP operation, Hub/UI, A2/A3, commit, push, reset or reclaim.
    - Delete-tool product work, locks, leases, checksums, hashes, version handshakes, multi-user or distributed coordination.
  executionSteps:
    - Trace only strict Review Result parsing and the current summary-repair eligibility/project/reconcile lifecycle from fresh source.
    - Write focused failing cases for bare safe labels and every unsafe value shape, including the whitespace-delimited CLI value.
    - Implement the minimum shared parser and repair-kind selection without changing public operations or Store shape.
    - Prove original assignment, identity, findings and disposition remain immutable and every actual-value case fails closed.
    - Run the accepted commands, inspect the exact three-path diff, return handoff in the final response and stop.
  deliverables:
    - Refined label-versus-value Review Result safety boundary.
    - One narrow historical unsafe-content path through the existing same-Judge summary-only repair.
    - Focused security, immutability, restart and effective-gate tests in tests/review-graph.test.ts.
    - Final-response-only handoff naming exact paths, safe/unsafe cases and unchanged authority gates.
  modules:
    - name: Credential label/value classifier
      responsibility: Allow standalone credential names/options while rejecting actual values in every bounded Review Result text field.
      consumes: [Bounded summary/finding text.]
      produces: [Strict safe text or typed unsafe-content failure.]
      boundaries: [No redaction, raw secret projection, broad allowlist or Provider-specific credential store.]
    - name: Historical repair eligibility
      responsibility: Recognize one persisted label-only unsafe-content false positive as an otherwise-valid original opinion.
      consumes: [Assignment failure, original Reviewer Task/result, exact Revision/ownership/private packet.]
      produces: [Existing one-shot repair admission or pre-mutation rejection.]
      boundaries: [No arbitrary unsafe repair, new assignment, identity change, Candidate rerun or Store schema.]
    - name: Same-Judge reconcile
      responsibility: Reuse the existing read-only derived Task and count it only when summary-only equality and strict parsing pass.
      consumes: [Repair kind, frozen identity, original result, repaired result.]
      produces: [Effective usable opinion and fresh Main-review evidence, or permanent repair failure.]
      boundaries: [No disposition/findings/Revision drift, retry, vote, Main decision or Integration.]
  callChain:
    - New Judge output enters the strict parser; label-only text passes and actual value shapes fail closed.
    - Main explicitly requests repair on one historical failed assignment.
    - ForkLight proves label-only eligibility and creates the existing same-identity read-only repair Task once.
    - The same Judge rewrites only summary; ForkLight strictly compares the opinion and updates effective Graph evidence.
    - Main alone later records a fresh decision and may integrate the unchanged A1 Candidate.
  scenarios:
    - name: Bare option names are safe
      given: A strict Review Result mentions a credential option or environment-field name without a value.
      when: ForkLight parses every bounded text field.
      then: The result remains eligible for normal schema validation.
    - name: Whitespace CLI value is unsafe
      given: A credential CLI option is followed by whitespace and an eight-or-more-character value.
      when: ForkLight parses it.
      then: It fails as unsafe-content and cannot enter historical label repair.
    - name: Other actual values remain unsafe
      given: Text contains a provider token shape, authorization value, password assignment or colon/equal credential assignment.
      when: ForkLight parses it.
      then: It fails as unsafe-content.
    - name: Historical label-only false positive
      given: A persisted succeeded Reviewer Task has failed assignment unsafe-content, otherwise-valid strict JSON, a known label and no repair.
      when: Main confirms the existing repair operation.
      then: One same-frozen-Judge read-only Task is appended without changing assignment count or original evidence.
    - name: Repaired opinion drifts
      given: The repair changes Revision, disposition or any finding.
      when: Reconcile validates it.
      then: The repair fails permanently with no retry or replacement.
  risks:
    - A permissive pattern could leak real values; explicit actual-value negatives across every supported shape must stay unsafe.
    - Historical admission could become generic unsafe repair; require exact old failure, refined strict-parser success and known-label presence.
    - Same-Judge rewriting could change meaning; existing exact findings/disposition/Revision equality remains mandatory.

    - Repair succeeds only with summary-only change and exact schemaVersion, Revision, disposition and findings; effective gate requires fresh Main review.
    - Exact diff contains only the three allowed paths and no handoff/evidence/docs/Goal/Spec file.
    - No A1 Candidate, live assignment, Hub UI, A2/A3, coordination mechanism or unrelated path is changed.

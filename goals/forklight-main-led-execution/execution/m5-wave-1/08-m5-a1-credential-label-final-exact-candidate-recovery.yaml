  outOfScope:
    - Any parser redesign, credential pattern change, new repair kind, new assignment, Candidate rerun, live MiniMax repair or Store schema change.
    - Any Worker edit outside src/core/review-graph.ts and tests/review-graph.test.ts on top of the exact three-path seed.
    - Handoff/evidence/Goal/Spec/docs files, Hub/UI, A2/A3, delete-tool work, locks, leases, checksums, hashes, version handshakes, multi-user or distributed coordination.
    - Extra Attempt, validation repair, Main correction, reverify, adaptation, retry, fallback, model switch, Competition, third/replacement Judge, further replacement, commit, push, reset or reclaim.
  executionSteps:
    - Inspect the existing equality helper and reconcile branch plus only the focused repair tests.
    - Add a failing focused case where every retained field including summary is unchanged.
    - Implement the minimum guard so that case terminates as semantic-drift while a genuinely changed summary still succeeds.
    - Run the accepted commands, inspect the exact three-path final diff, return a concise final-response handoff and stop.
  deliverables:
    - One explicit unchanged-summary rejection in the existing reconcile path.
    - One focused regression proving a no-op same-Judge response cannot become usable evidence.
    - The complete exact three-path Candidate with all previous label/value, one-shot, identity and gate behavior preserved.

    - Grok inspects the existing same-Judge reconcile path and adds only the summary inequality guard and focused test.
    - ForkLight independently runs build, the five-file focused suite and diff validation.
    - Exactly two fresh read-only Judges inspect the complete Candidate; Main alone may accept and integrate it serially.
  scenarios:
    - name: Genuine summary repair
      given: The same frozen Judge returns the exact original opinion except for a changed bounded summary.
      when: ForkLight reconciles the terminal repair Task.
      then: Existing success behavior remains unchanged and the opinion may become usable.
    - name: No-op summary response
      given: The same frozen Judge returns the exact original opinion including an unchanged summary.
      when: ForkLight reconciles the terminal repair Task.
      then: The repair fails permanently as semantic drift and cannot satisfy the Review gate.
    - name: Other semantic drift
      given: Revision, schemaVersion, disposition or findings differ.
      when: ForkLight reconciles the result.
      then: Existing permanent semantic-drift behavior remains unchanged.

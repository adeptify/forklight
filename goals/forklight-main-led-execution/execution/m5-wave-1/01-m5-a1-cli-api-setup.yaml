acceptance:
  criteria:
    - A clean settings home exposes one concise readiness summary and one unambiguous next action without starting Hub, Task, Worker or paid probe.
    - Local-sign-in and API-key Providers are distinguished correctly; credentials travel through stdin only and never appear in argv, output, Store, receipt, exception or handoff.
    - Existing-key unreadability and settings failure preserve prior Keychain/settings truth; focused tests prove rollback and content-free failure.
    - A built-in Worker is listable/selectable without file editing; invalid profile ids do not mutate settings.
    - Supported Main status/install/uninstall use existing backups and explicit confirmation, with temp-only test state and clear new-session guidance.
    - Existing authenticated setup API, doctor, health, settings and Main installer behavior remain compatible.
    - No Hub UI, backup/restore, Store schema, auto-work, coordination machinery or unrelated path exists in the Candidate.
    - Grok 4.6 Xhigh runs this Work Item through native Goal, ForkLight independently verifies it, two different-view Judges review it and Main alone decides serial Integration.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/cli-setup.test.ts tests/setup-service.test.ts tests/hub-main-install.test.ts tests/main-install-skill.test.ts tests/hub-settings.test.ts
    - git diff --check

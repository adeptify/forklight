reviewRequirement:
  requiredJudges: 2
  reason: This changes secret-output filtering and Review/Integration authority; two different-view read-only Judges must inspect actual-value rejection and same-Judge immutability before Main Integration.
contract:
  outcome: Allow bounded Judge results to name credential fields or CLI options without treating the label itself as a secret, keep actual secret-shaped values unsafe, and admit one historical label-only unsafe-content assignment to the existing one-shot same-Judge summary repair without rerunning its Candidate or changing Judge identity.
  presentation:
    summary: 允许Judge说出“密钥字段名”，但真实密钥值继续严格拦截。
    language: zh-CN
  context:
    - Read AGENTS.md, specs/m5-product-graduation/work-items/credential-label-judge-repair/spec.md and goals/forklight-main-led-execution/evidence/m5-a1-credential-label-repair-audit.md completely before editing. They are the sole accepted boundary.
    - Current Review Result parsing rejects any bare API_KEY/API-KEY token in summary or findings. That makes harmless option and field names indistinguishable from values.
    - Current MiniMax assignment 54805d0d-4a37-4f05-ae68-53cc7ba687e0 belongs to Candidate Task 922238a4-ac7c-461f-b37c-2b2384800fee and failed only as unsafe-content. Its retained strict JSON proposes accept and contains labels but no secret value.
    - Reuse the graduated append-only, one-shot, same-frozen-Judge, read-only summary repair. Add no new assignment, public command, Store entity/schema or automatic trigger.
    - Ordinary new output with label-only text should parse directly. Historical repair eligibility must require failed unsafe-content, a succeeded original Reviewer Task, no repair, exact ownership/private packet, complete success under the refined strict parser and presence of a known label.
    - Actual provider token shapes, authorization values, password assignments and credential-label assignments with values remain unsafe. Add focused negative tests before treating the slice complete.
    - The repair may change only summary. Exact schemaVersion, Candidate Revision, disposition and all findings remain equal. Original status/failure/raw evidence stay immutable.
    - ForkLight serves one local developer. Add no checksum, content hash, lock, lease, version handshake, duplicate coordination state, multi-user or distributed behavior.
    - Work only in the isolated Workspace. Never touch the A1 Candidate Workspace, create/repair its live assignment, integrate, commit, push, reset or edit Hub UI.
  inScope:
    - Refine Review Result credential detection from bare-name rejection to actual-value rejection with explicit label recognition.
    - Add narrow historical unsafe-content eligibility alongside unchanged overlong-summary eligibility in the existing repair lifecycle.
    - Generate kind-specific same-Judge repair instructions while preserving summary-only equality and frozen identity.
    - Reconcile either eligible repair kind idempotently and keep aggregation, fresh-Main and Integration gates truthful.
    - Add focused parser, historical-assignment, one-shot, identity, semantic-drift, restart, CLI/MCP/privacy and Integration-gate regressions where needed.
  outOfScope:
    - A1 Candidate paths/run/revision, live MiniMax repair, new Graph/assignment/Judge, third/replacement Judge, reduced Judge requirement, semantic re-review, disposition/findings change or automatic retry.
    - Arbitrary unsafe-content repair, silent redaction/truncation, weakening actual secret rejection, Store schema/entity, new CLI/MCP operation, Hub/UI, A2/A3, commit, push or reset.
    - Locks, leases, checksums, hashes, version handshakes, multi-user or distributed coordination.
  executionSteps:
    - Trace only strict Review Result parsing, current summary-repair eligibility/project/reconcile and focused transport/gate tests.
    - Write failing focused cases for safe labels and unsafe values, plus a simulated durable historical label-only assignment.
    - Implement the minimum shared parser and repair-kind selection without changing existing public operation or Store shape.
    - Prove original assignment/identity/findings remain immutable and every actual-value negative case fails closed.
    - Run all accepted commands, inspect the scoped diff and stop when one complete passing slice exists.
  deliverables:
    - Refined label-versus-value Review Result safety boundary.
    - One narrow historical unsafe-content path through the existing same-Judge summary-only repair.
    - Focused security, immutability, restart/public-surface and gate tests.
    - Concise handoff naming exact paths, safe/unsafe cases and the post-activation real repair command.
  modules:
    - name: Credential label/value classifier
      responsibility: Allow standalone credential names/options while rejecting actual values in every bounded Review Result text field.
      consumes: [Bounded summary/finding text.]
      produces: [Strict safe text or typed unsafe-content failure.]
      boundaries: [No redaction, raw secret projection, broad allowlist or Provider-specific credential store.]
    - name: Historical repair eligibility
      responsibility: Recognize one persisted label-only unsafe-content false positive as an otherwise-valid original opinion.
      consumes: [Assignment failure, original Reviewer Task/result, exact Revision/ownership/private packet.]
      produces: [Existing one-shot repair admission or pre-mutation rejection.]
      boundaries: [No arbitrary unsafe repair, new assignment, identity change, Candidate rerun or Store schema.]
    - name: Same-Judge reconcile
      responsibility: Reuse the existing read-only derived Task and count it only when summary-only equality and strict parsing pass.
      consumes: [Repair kind, frozen identity, original result, repaired result.]
      produces: [Effective usable opinion and fresh Main-review evidence, or permanent repair failure.]
      boundaries: [No disposition/findings/Revision drift, retry, vote, Main decision or Integration.]
  callChain:
    - New Judge output enters the strict parser; label-only text passes and actual value shapes fail closed.
    - Main explicitly requests repair on one historical failed assignment.
    - ForkLight proves label-only eligibility and creates the existing same-identity read-only repair Task once.
    - The same Judge rewrites only summary; ForkLight strictly compares the opinion and updates effective Graph evidence.
    - Main alone later records a fresh decision and may integrate the unchanged A1 Candidate.
  scenarios:
    - name: Bare option names are safe
      given: A strict Review Result mentions credential option or environment-field names without a value.
      when: ForkLight parses every bounded text field.
      then: The result remains eligible for normal schema validation.
    - name: Actual values remain unsafe
      given: Text contains a secret-shaped token, authorization value, password assignment or credential label assigned an eight-plus-character value.
      when: ForkLight parses it.
      then: It fails as unsafe-content and cannot enter historical label repair.
    - name: Historical label-only false positive
      given: A persisted succeeded Reviewer Task has failed assignment unsafe-content, otherwise-valid strict JSON, a known label and no repair.
      when: Main confirms the existing repair operation.
      then: One same-frozen-Judge read-only Task is appended without changing assignment count or original evidence.
    - name: Repaired opinion drifts
      given: The repair changes Revision, disposition or any finding.
      when: Reconcile validates it.
      then: The repair fails permanently with no retry or replacement.
  risks:
    - A permissive pattern could leak real values; explicit actual-value negatives across every supported shape must stay unsafe.
    - Historical admission could become generic unsafe repair; require exact old failure, refined strict-parser success and known-label presence.
    - Same-Judge rewriting could change meaning; existing exact findings/disposition/Revision equality remains mandatory.

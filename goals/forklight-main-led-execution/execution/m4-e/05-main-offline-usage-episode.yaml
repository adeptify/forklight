acceptance:
  criteria:
    - Two or more exact Codex terminal segments persist one aggregate role sample whose disjoint parent totals equal the safe segment sums and survive Store reopen.
    - Every segment run ref and count component is visible count-only through status, CLI and MCP; no raw content or terminal body is stored or echoed.
    - Malformed/unknown/content-bearing input, duplicate within-episode segment refs, unsafe sums, identity mismatch and duplicate comparison role fail before persistence with stable non-echoing errors.
    - Existing single-run capture, schema-version-1 rows, pair assessment/report, value report and all current M4 comparisons remain behavior compatible.
    - Core, Daemon, CLI and MCP share one episode implementation and schema; status remains count-only and never claims savings.
    - Documentation and a focused regression prove staged prepare timeout/re-entry is observation-only, uses the same durable Task/Graph and counts every resumed Main segment.
    - No Hub/UI, routing, Runtime, storage deletion, old evidence, coordination mechanism, credential, commit, push, reset or unrelated path change exists.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/main-token-usage.test.ts tests/main-token-pair.test.ts tests/main-token-value-report.test.ts tests/main-delivery.test.ts tests/daemon.test.ts tests/daemon-cli.test.ts tests/mcp.test.ts
    - git diff --check

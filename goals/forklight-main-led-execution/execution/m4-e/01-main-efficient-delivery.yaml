acceptance:
  criteria:
    - One prepare call can submit one Task, observe Worker and independent verification, create or reuse exactly the confirmed required Judge set, wait to terminal review and return a compact checkpoint without Main decision or Integration.
    - One decide accept call exact-binds Main review, runs one fresh preflight and one Integration, waits to terminal and returns compact final truth; revise/reject never integrate.
    - Observation timeout or client loss never cancels, fails, resumes, retries or recreates work; exact re-entry reuses one Task, Review Graph, Main review, receipt and Integration operation.
    - Invalid or stale Candidate identity, wrong or reordered Reviewer set, review/schema blocker, source drift and failed Integration stay visible and fail closed without automatic repair or loop.
    - Daemon, CLI JSON/human and MCP share one bounded privacy-safe schema; large logs/events/success stdout do not enlarge it and optional diff obeys the explicit byte bound.
    - Each top-level prepare/decide call records one redacted Main exchange boundary; internal deterministic steps do not appear as separate Main interactions.
    - Existing granular commands and durable Task/Review/Main/Integration records remain backward compatible; no new persistence entity or coordination mechanism exists.
    - No Hub/UI, calibration, routing, storage reclaim, credential, commit, push, reset or unrelated path change exists.
    - One Grok 4.6 Xhigh native Goal, ForkLight independent verification, two different-view Judges and Main serial safe Integration complete the quality chain.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/main-delivery.test.ts tests/cli-supervision.test.ts tests/cli-exchange-receipts.test.ts tests/review-graph.test.ts tests/integration.test.ts tests/daemon.test.ts tests/daemon-cli.test.ts tests/mcp.test.ts
    - git diff --check

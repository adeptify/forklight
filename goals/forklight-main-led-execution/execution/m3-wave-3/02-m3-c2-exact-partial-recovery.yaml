contract:
  outcome: Reuse exactly the protected 14-path M3-C2 partial in one fresh isolated Workspace, correct the three known test defects and four accepted-contract gaps, and deliver the completed additive read-only strategy/policy advice through the unchanged M3-C2 quality chain.
  presentation:
    summary: 原样复用已完成的大部分M3-C2，只修七个已定位缺口并完成正常验收。
    language: zh-CN
  context:
    - Read AGENTS.md, specs/m3-c-strategy-policy-learning/spec.md and goals/forklight-main-led-execution/evidence/m3-c2-infra-pause-decision-packet.md completely before editing. They are the sole accepted product and recovery boundary; do not create another spec or roadmap.
    - Failed Task bbec21f9-ae21-4bfd-9cc4-9476aea3f73a, its Workspace, Runtime Home, Session, native Goal and absent Candidate chain are immutable and protected. Do not resume, repair, reverify or modify them.
    - Main's operational bootstrap proves the old baseline-to-Workspace product/test delta names exactly the accepted 14 paths, proves this fresh Workspace starts from that same product/test source base, and materializes the exact bytes before Grok starts.
    - This is a fresh honest Grok 4.6 Xhigh native Goal. Never claim continuity with native Goal 9b022da8-45a9-46de-be6a-c104272fcf94.
    - The retained partial already separates execution-mode evidence, exposes additive Daemon/CLI/MCP advice, separates Main-direct history, and reports underlying Judge identity diversity. Preserve usable behavior and fix only verified gaps.
    - The three diagnostic defects are two daemon fixture typing errors and one over-broad negative CLI assertion that matches desired explanatory wording.
    - The four product gaps are intent-none history evaluation, trigger-incompatible Competition matching, legacy-unknown recommendation eligibility, and the missing strict-evidence recommendation gate.
    - ForkLight serves one local developer. Add no checksum, content hash, manifest, lock, lease, version handshake, migration, multi-user or distributed coordination mechanism.
    - The Task has one base Attempt, at most one Worker validation repair and one Main correction/reverification. It has no generic extra Attempt, adaptation, fallback, reroute, model switch or further replacement. Stop when acceptance passes or the permitted correction chain cannot close the frozen gaps.
  inScope:
    - Preserve the exact protected partial and correct the two tests/daemon.test.ts fixture types with the narrowest accurate fixtures.
    - Replace the over-broad legacy CLI negative assertion with a focused check that rejects actual automatic actions while preserving explicit negative explanatory output.
    - For Competition intent none, return not-advised without evaluating or projecting historical Competition counts/outcomes.
    - For consider or required, evaluate Competition history only when Main supplies valid triggers and include only history compatible with those triggers and requested scope.
    - Keep legacy-unknown evidence visible but display-only; it cannot enter a recommendation cohort or be returned as an executable strategy.
    - Preserve strict missing-evidence policy so unavailable positive factors cannot produce a strict-mode strategy recommendation.
    - Add focused regression coverage for each corrected behavior, run the unchanged original acceptance commands, and hand off exact paths and remaining evidence limits.
  outOfScope:
    - Any new endpoint, entity, migration, historical rewrite, automatic Competition, Judge selection/replacement, vote, third Judge, retry policy, Integration authority, synthetic Provider Task, benchmark, global leaderboard, Hub/UI, M4 Token/value work, commit, push or reset.
    - Any path outside the exact 14 focus paths, redesign of accepted M3-A/M3-B/M3-C1 contracts, or coordination/integrity mechanism beyond the operational wrong-partial/source-base check.
  executionSteps:
    - Inspect the already-materialized partial, accepted Spec and seven frozen gaps before changing code.
    - Correct focused tests and product gates without recreating accepted behavior or widening the public surface.
    - Run the build and focused suite, inspect the exact diff and stop immediately when all acceptance criteria pass.
  deliverables:
    - One exact-path Candidate containing the protected partial plus only the seven scoped corrections and their focused coverage.
    - Passing ForkLight independent acceptance evidence and one exact Revision ready for two fresh different-view Judges.
    - A concise Worker handoff naming behavior, paths, verification and any remaining natural-history evidence limitation.
  modules:
    - name: Mode-aware strategy evidence
      responsibility: Keep comparable execution modes separate while excluding legacy unknown and preserving strict evidence gates.
      consumes: [Natural terminal Task history, exact class, explicit family, accepted routing policy.]
      produces: [Read-only evidence rows and supported recommendation or stable cannot-determine.]
      boundaries: [No model-free ranking change, synthetic work, inferred mode or historical migration.]
    - name: Explicit Competition and Judge policy explanation
      responsibility: Explain only Main-supplied policy using compatible natural history and underlying identity truth.
      consumes: [Competition intent and valid triggers, natural Competition records, explicit review requirement and Review Graph outcomes.]
      produces: [Not-advised or explanatory policy projection without mutation, vote or inferred authority.]
      boundaries: [Intent none does not evaluate history; no automatic Competition or Judge action.]
    - name: Canonical public projection
      responsibility: Keep Daemon, CLI and MCP output additive, compatible and privacy-safe.
      consumes: [Canonical routing advice and focused strategy/policy projection.]
      produces: [Consistent read-only JSON and human output.]
      boundaries: [No second routing system, Store mutation or Hub/UI.]
  callChain:
    - Main-owned bootstrap validates and copies the exact protected partial into the fresh Task Workspace.
    - Grok 4.6 Xhigh starts a new native Goal, corrects only the frozen gaps and self-checks.
    - ForkLight independently runs the bootstrap policy test and unchanged original M3-C2 commands, then captures one exact Candidate Revision.
    - Exactly two fresh independent Judges inspect the same Revision from different views; Main reviews all paths and alone may integrate serially.
  scenarios:
    - name: Intent none stays unevaluated
      given: Matching natural Competition history exists but Main supplies intent none.
      when: Strategy/policy advice is requested.
      then: Competition is not advised and historical counts or outcomes are not evaluated or projected.
    - name: Trigger-compatible explanation only
      given: Main supplies consider or required plus valid triggers and scoped Competition history contains multiple reasons.
      when: Policy history is projected.
      then: Only scope- and trigger-compatible history appears, and it cannot start or mutate work.
    - name: Unknown and missing evidence stay honest
      given: Legacy missing-mode rows or unavailable strict positive factors exist.
      when: Execution strategies are scored.
      then: Unknown remains display-only and strict mode returns cannot-determine rather than a recommendation.
    - name: Exact recovery delivers
      given: The protected partial and current source base match the authorized path set.
      when: Grok closes all seven gaps and the independent commands run.
      then: One verified Revision proceeds to two Judges and Main serial Integration.
  risks:
    - Rebuilding the partial could regress accepted behavior; exact materialization and same-path corrections preserve the reusable result.
    - Stale source or a changed old Workspace could create the wrong Candidate; the focused bootstrap compares product/test bytes and exact delta paths before launch.
    - Historical summaries can look authoritative; focused none/trigger/unknown/strict tests must prove that advice remains explanatory and read-only.

acceptance:
  criteria:
    - Provider/model/Runtime/effort/execution mode is the comparable strategy identity; single-run, persistent-session, native-goal and legacy unknown rows never merge or borrow samples.
    - Exact-class evidence wins and family fallback remains complete-set only; fewer than two comparable strategies, insufficient samples or insufficient gap returns cannot-determine without creating work.
    - Non-model failure exclusion and ambiguous visibility remain intact, and Main-direct history is separate from Worker quality comparison.
    - Competition intent none remains not advised; consider/required history is evaluated only with valid explicit triggers and is explanation only.
    - Judge projection reports declared depth, usable/unusable results and distinct underlying execution identities; it never votes, infers depth, assigns or replaces Judges, adds a third Judge or changes Integration gates.
    - Existing routing fields and legacy candidate callers remain compatible; Daemon, CLI and MCP expose consistent privacy-safe additive output with no Store mutation.
    - The exact Candidate stays inside accepted M3-C2 paths, has no Hub/UI, M4, coordination-mechanism or unrelated changes, and passes ForkLight independent verification plus two different-view Judges before Main Integration.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/statistics.test.ts tests/model-routing.test.ts tests/competition.test.ts tests/review-graph.test.ts tests/main-failure-attribution.test.ts tests/daemon.test.ts tests/daemon-cli.test.ts tests/mcp.test.ts
    - git diff --check

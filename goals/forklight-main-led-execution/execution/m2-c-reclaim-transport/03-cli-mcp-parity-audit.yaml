  modules:
    - name: Shared reclaim transports
      responsibility: Audit CLI and MCP parity at the daemon client boundary.
      consumes: [CLI call site, MCP call site, shared client, and tests.]
      produces: [Pass or one exact divergence.]
      boundaries: [No storage mutation, duplicated policy, replay, or UI.]

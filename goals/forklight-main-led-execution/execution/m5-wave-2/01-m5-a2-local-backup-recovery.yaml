acceptance:
  criteria:
    - Preview/create/inspect/restore expose concise human and JSON included, excluded, integrity, impact and next-action facts without starting or signalling owners.
    - A temp-home round trip restores settings, Store records, durable Task evidence, unknown top-level data and a protected partial Workspace while keeping the previous Home as a recovery copy.
    - Keychain, external Main/runtime auth and transient socket/log/owner/WAL/SHM entries are explicitly absent and no secret is read or printed.
    - Existing/inside-Home destination, live owner, malformed manifest, unreadable or foreign-key-invalid Store, escaping link/path and interrupted activation fail without corrupting the prior Home.
    - Backup creation never follows an external link; produced backup is self-contained and modified escaping input is rejected before mutation.
    - No per-file integrity mechanism, lock, lease, version handshake, automatic owner termination, Hub UI or unrelated path exists in the Candidate.
    - Grok 4.6 Xhigh uses native Goal, ForkLight independently verifies exact commands, two different-view Judges review exact Revision and Main alone decides serial Integration.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/local-backup-recovery.test.ts tests/store.test.ts tests/daemon.test.ts tests/daemon-cli.test.ts tests/mcp.test.ts
    - git diff --check

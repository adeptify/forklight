    - tests/task-preview.test.ts
    - tests/daemon.test.ts
    - tests/daemon-cli.test.ts
    - tests/mcp.test.ts
acceptance:
  criteria:
    - Followed recommendation, manual override, and selection after cannot-determine persist and project exactly as the accepted Spec requires.
    - Contradictory advisory/selection/shortlist/confidence/Task identity shapes fail before persistence while legacy Tasks remain readable without invented facts.
    - CLI validate/preview, Daemon, MCP, and Core use one privacy-safe explanation and expose no private note, settings digest, or raw evidence keys.
    - Candidate changes only the fourteen focus paths and adds no Store entity, migration, coordination mechanism, automatic work, M3-C policy, or Hub/UI.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/task.test.ts tests/task-preview.test.ts tests/daemon.test.ts tests/daemon-cli.test.ts tests/mcp.test.ts
    - git diff --check

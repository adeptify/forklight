version: 2
name: M3-B freeze advisory relationship and manual override truth
project: /Users/yijunwang/code/forklight
taskClass: m3-durable-routing-override
taskFamily: forklight-routing-decision
workerProfileId: grok-4-6-xhigh
executionPreference: auto
routingDecision:
  taskFamily: forklight-routing-decision
  shortlist:
    - provider: xai
      model: grok-4.6
      runtime: grok-build
      effort: xhigh
      workerProfileId: grok-4-6-xhigh
    - provider: deepseek
      model: deepseek-v4-pro[1M]

  allowEdits: true
  allowedCommands: []
  focusPaths:
    - src/workers/grok.ts
    - src/workers/grok-goal.ts
    - src/core/execution-mode.ts
    - src/core/settings.ts
    - tests/worker-runtime.test.ts
    - tests/task.test.ts
    - tests/worker-profiles.test.ts
    - tests/worker-readiness.test.ts
    - tests/cli-health.test.ts
    - tests/task-preview.test.ts
    - tests/competition.test.ts
    - tests/goal.test.ts
    - docs/configuration.md
    - docs/main-clients/grok-build.md
    - docs/main-led-delivery.md
acceptance:
  criteria:
    - New Grok 4.6 Xhigh auto Tasks consistently freeze and project native-goal; explicit persistent-session and historical omitted records preserve compatible truth.
    - First launch, same-Goal resume, and post-completion successor correction use Grok CLI /goal with the frozen Session, model, effort, env and bounded tool policy.
    - Only exact Task-local complete plus achieved plus readable owned details admits Worker success; all false, paused, unknown, malformed, ambiguous, or escaping evidence fails closed.
    - Candidate changes only accepted source, focused tests and narrow docs; ForkLight independent verification remains separate from Grok native skeptics.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/worker-runtime.test.ts tests/task.test.ts tests/worker-profiles.test.ts tests/worker-readiness.test.ts tests/cli-health.test.ts tests/task-preview.test.ts tests/competition.test.ts tests/goal.test.ts
    - git diff --check

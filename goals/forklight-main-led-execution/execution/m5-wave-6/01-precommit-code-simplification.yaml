acceptance:
  criteria:
    - Every changed production path has one named responsibility; proven duplicate projection/state/helper paths are removed and intentionally retained similarities have distinct semantics.
    - Worker assignment guidance has one normalization owner, reaches Main through a read-only safe catalog and never reaches resolved Worker or Task/Runtime prompt input.
    - Existing Worker Profile compatibility, setup/CLI output, Main catalog, Work/Decision/System, Delivery/Worker drafts and task-detail continuity remain unchanged.
    - The Candidate changes only allowed paths, contains no generated output, debug code, Store mutation, commit or push.
    - ForkLight independent verification passes and one independent Judge accepts before Main integration.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/worker-profiles.test.ts tests/setup-service.test.ts tests/cli-setup.test.ts tests/mcp.test.ts tests/main-install-skill.test.ts
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/hub-responsive-layout.test.ts tests/hub-settings.test.ts tests/hub-ui-assets.test.ts
    - node --check src/hub/public/app.js
    - git diff --check

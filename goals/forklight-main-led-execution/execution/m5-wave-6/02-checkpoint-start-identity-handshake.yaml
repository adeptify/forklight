acceptance:
  criteria:
    - Cold checkpoint_start passes the unchanged under-1000ms assertion and completes its approved command exactly once through bounded wait/report.
    - Mutating daemonRequest compares build and protocol identity before the actual mutating exchange; stale identity remains fail-closed with stable errors.
    - Server-side mutation identity enforcement, read-only mismatch behavior, shutdown exception and complete explicit health output remain unchanged.
    - Identity preflight is read-only and never loads coordinator health, Provider or credential inspection.
    - The Candidate changes only allowed paths and contains no generated output, threshold relaxation, debug code, Store mutation, commit or push.
    - ForkLight independent verification passes and two independent Judges accept before Main integration.

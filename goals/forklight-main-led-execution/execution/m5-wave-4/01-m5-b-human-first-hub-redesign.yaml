acceptance:
  criteria:
    - The Hub defaults to a light Goal-first product shell with a searchable/resizable Now-History Goal Tree, one continuous Goal file, one Decision Center and quiet auxiliary System access; the old dark/teal configuration rail and peer-tab dashboard are gone.
    - An active, decision-required, blocked/partial and completed Goal/Task each show desired result or result context, plain current fact, reason, retained work where applicable and the next meaningful action without raw internal vocabulary in primary copy.
    - Decision Center is grouped by Goal plus bounded parentless work, derives from canonical hierarchy/detail truth and reuses existing confirmed actions without a second stored decision model or duplicate mutation path.
    - Existing authentication, loading/error/empty states, setup and configuration routes, privacy projections, safe actions, confirmations and canonical lifecycle inputs continue to work and remain covered.
    - Live refresh preserves selection, Goal Tree width/query, scroll, filters, open evidence and unsubmitted drafts without focus theft; 760px-and-below flow has one primary pane and an obvious Back action.
    - GoalBoard-family palette, typography, hairlines, 3-8px radii, flat surfaces, focus, contrast and reduced motion are applied consistently; page-visible copy has no em dash or en dash and technical facts stay folded.
    - DESIGN.md documents the actual implemented system; only the seven allowed Writer paths change, no backend or GoalBoard/SSOT path changes, and no commit or push occurs.
    - Grok 4.6 Xhigh runs through native Goal in one ForkLight Task, ForkLight independently executes all accepted checks, two different-view read-only Judges review the exact Candidate and Main alone decides serial Integration.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/hub-ui-assets.test.ts tests/hub-responsive-layout.test.ts tests/hub-contract-quality.test.ts tests/hub-settings.test.ts tests/hub-operations.test.ts tests/hub-ops-mutations.test.ts
    - node -e "const fs=require('fs'); const src=fs.readFileSync('src/hub/public/app.js','utf8'); new Function(src); const visible=[fs.readFileSync('src/hub/public/index.html','utf8'),src,fs.readFileSync('src/hub/public/i18n.js','utf8')].join('\\n'); if(/[—–]/.test(visible)) throw new Error('page-visible Hub source contains em/en dash');"
    - git diff --check

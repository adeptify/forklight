acceptance:
  criteria:
    - Exact Revision 8454e3cf is materialized on a matching source base; the three prior Tasks remain immutable and Grok reads no sibling Workspace.
    - At 320/360/390, every visible product/page-shell and open System-menu bounding box fits the viewport, permanent chrome is at most 96px, labels stay horizontal and no core control is hidden or clipped.
    - Product row contains only accessible ForkLight identity plus Work, Decision Center and System; page row contains conditional Back plus title; redundant mobile top-meta is not permanent chrome and desktop stays unchanged.
    - System routes, theme/language and connection truth use the existing controls; selection, outside pointer/touch and Escape close the menu, Escape restores summary focus and keyboard/touch targets remain practical.
    - Motion is purposeful and bounded to 120-160ms opacity/small vertical translation or state-color feedback, has no loop/scale/bounce and is fully disabled by prefers-reduced-motion without changing behavior.
    - Back appears only for narrow file/detail state, Goal entry remains at exact scrollTop zero, Back restores tree context and narrow-to-wide resize hides it without fetch or refresh.
    - Desktop retains the accepted Goal Tree, about 68ch Goal file, one-line status, top meta, independent Decision Center route/body, safe actions and focus behavior.
    - DESIGN.md, i18n.js, Goal/Decision content, data/actions and backend remain byte-identical to the seed; detector is not rerun and visible copy has no em dash or en dash.
    - ForkLight independently verifies the complete Candidate; exactly two different-view read-only Judges inspect the final Revision and Main alone decides serial Integration.

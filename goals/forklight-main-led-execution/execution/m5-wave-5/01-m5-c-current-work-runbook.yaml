acceptance:
  criteria:
    - Runbook section 5 uses Work, New Goal, Add Plan and Add Task and no longer points the operator to Overview / Run your first real Task.
    - The instructions preserve outcome intake, proposal and explicit confirmation before work starts, then ordinary Task Detail, Main review and safe Integration.
    - An unfamiliar operator is not asked to write YAML/JSON, edit settings or inspect Store/database state.
    - Exactly docs/m1-clean-user-runbook.md and tests/clean-run-bundle.test.ts change; no product behavior or other documentation changes.
    - ForkLight independent verification passes. One independent ordinary Judge must accept the exact Revision before Main serial Integration.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/clean-run-bundle.test.ts
    - npm run build
    - git diff --check

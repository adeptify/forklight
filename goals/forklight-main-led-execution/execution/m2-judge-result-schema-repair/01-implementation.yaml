acceptance:
  criteria:
    - Only a single otherwise-valid JSON result with summary over 500 is repairable; every other failure rejects before mutation.
    - Original assignment evidence remains unchanged and one repair record permanently consumes the allowance.
    - Repair Task preserves exact frozen Judge identity and packet, is read-only, and has one base Attempt with zero fallback or automatic retry.
    - A repair counts only when strict parsing passes and exact Revision, disposition and findings match; aggregation/gate then require a fresh Main decision without adding a Judge.
    - Daemon restart resumes the same durable repair Task, and CLI/MCP expose only privacy-safe explicit control/status.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/review-graph.test.ts tests/store.test.ts tests/daemon.test.ts tests/daemon-cli.test.ts tests/mcp.test.ts tests/integration.test.ts
    - git diff --check

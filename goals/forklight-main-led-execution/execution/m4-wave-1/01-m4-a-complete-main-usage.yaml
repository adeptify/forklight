acceptance:
  criteria:
    - Direct-main and delegated-main complete samples reuse canonical Codex terminal counters and round-trip through Store, Daemon, CLI and MCP with identical count-only truth.
    - Task class, family and Main profile derive only from stored Task; missing or contradictory identity fails before persistence.
    - Each comparison admits one sample per role and each sample/run identity is unique; duplicate failure never overwrites existing evidence.
    - Status is read-only, reports missing roles explicitly and never computes pair validity, savings, quality or family value.
    - Existing direct-Codex calibration, exchange-receipt, Token and economics surfaces remain readable and semantically separate.
    - No raw/private content, tokenizer, Provider call, auto-work, Hub/UI, coordination mechanism or unrelated path exists.
    - One Grok 4.6 Xhigh native Goal, ForkLight independent verification, two different-view Judges and Main serial Integration complete the quality chain.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/main-token-usage.test.ts tests/store.test.ts tests/daemon.test.ts tests/daemon-cli.test.ts tests/mcp.test.ts
    - git diff --check

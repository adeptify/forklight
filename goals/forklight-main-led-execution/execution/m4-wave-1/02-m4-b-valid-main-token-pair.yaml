acceptance:
  criteria:
    - Accepted pairs require two complete opposite-role samples with exact same stored Task/comparison/class/family/profile/source identity and all three explicit comparison gates.
    - Accepted assessment requires a bounded direct verification reference plus current independent verification, exact Main accept and the exact successful delegated Integration operation.
    - Missing, stale, mismatched or rejected evidence returns a closed reason and never produces a saving or calibration claim.
    - Pair report uses terminal counters only, preserves signed zero/negative results and types percentage unavailable for a zero direct baseline.
    - Assessment/report are privacy-safe, read-only where declared, create no work and leave existing delivery authority and legacy evidence unchanged.
    - No family aggregation, automatic work, Hub/UI, coordination mechanism or unrelated path exists.
    - One Grok 4.6 Xhigh native Goal, ForkLight independent verification, two different-view Judges and Main serial Integration complete the quality chain.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/main-token-usage.test.ts tests/main-token-pair.test.ts tests/store.test.ts tests/daemon.test.ts tests/daemon-cli.test.ts tests/mcp.test.ts
    - git diff --check

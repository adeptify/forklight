acceptance:
  criteria:
    - Empty, uncovered, invalid and legacy-only families return deterministic cannot-determine with typed reasons; missing evidence is never a zero sample.
    - Only current accepted M4-B pairs contribute a Main result; rejected, stale and incomplete comparisons remain visible and cannot graduate a family.
    - Every comparison exposes exact direct/delegated Main totals, signed change, percentage availability and quality gates; strictly positive direct-minus-delegated is required for proven-lower.
    - Worker Token, Runtime estimate, native-currency Provider cost, time and correction/handoff evidence remain separate with explicit denominators and unavailable reasons.
    - All valid pairs remain visible; no percentage averaging, model ranking, hidden favorable selection, FX conversion, cap-as-spend or unavailable-as-zero exists.
    - Daemon, CLI JSON/human and MCP agree on one privacy-safe read-only response and create no work.
    - No representative calibration execution, report-file write, Hub/UI, coordination mechanism or unrelated path exists.
    - One Grok 4.6 Xhigh native Goal, ForkLight independent verification, two different-view Judges and Main serial Integration complete the quality chain.
  commands:
    - npm run build
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/main-token-usage.test.ts tests/main-token-pair.test.ts tests/main-token-value-report.test.ts tests/task-economics-report.test.ts tests/daemon.test.ts tests/daemon-cli.test.ts tests/mcp.test.ts
    - git diff --check

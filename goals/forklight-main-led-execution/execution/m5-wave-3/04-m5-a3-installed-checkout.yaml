reviewRequirement:
  requiredJudges: 1
  reason: This is an ordinary one-file checkout behavior correction with one deterministic acceptance command; one independent read-only Judge is sufficient.
contract:
  outcome: Make loyalty credit reduce the taxable subtotal before tax while preserving coupon order, validation, rounding and the non-negative total floor.
  presentation:
    summary: 积分抵扣应先减少计税金额，再计算税费；其他结账规则保持不变。
    language: zh-CN
  context:
    - This project is one untouched copy of the installed ForkLight package fixture. Main verified all three copied files match the packaged source before submission.
    - The current loyalty case returns 900 cents for subtotal 1000, loyalty 200 and tax 10%, but the accepted result is 880 cents.
    - Work only in the isolated ForkLight Workspace. Do not edit the disposable source project directly, the ForkLight source checkout, Goal evidence, settings, credentials or external run artifacts.
  inScope:
    - Correct calculate_total so loyalty credit reduces the post-coupon taxable amount before tax.
    - Preserve current integer rounding, input validation, coupon behavior and zero floor.
  outOfScope:
    - Public signature changes, new checkout features, test rewrites, documentation changes, dependencies, retries, UI, setup, backup, Git operations or any file other than checkout.py.
  executionSteps:
    - Read README.md, checkout.py and tests/test_checkout.py to confirm the exact arithmetic contract.
    - Make the smallest coherent checkout.py change that handles ordinary and over-credit cases.
    - Review validation, coupon, rounding and floor behavior, then leave verification to ForkLight's accepted command.
  deliverables:
    - One-file Candidate changing only checkout.py.
    - A short final explanation of the arithmetic order and preserved behavior.
  modules:
    - name: checkout total calculation
      responsibility: Validate inputs and calculate a non-negative coupon-, loyalty- and tax-adjusted total.
      consumes: [subtotal cents, coupon percent, loyalty cents, tax rate]
      produces: [final total cents]
      boundaries: [unchanged signature, unchanged validation, unchanged integer rounding]
  callChain:
    - Callers provide validated checkout inputs to calculate_total.
    - calculate_total applies coupon, then loyalty credit with a zero floor, then tax.
    - The function returns the taxable remainder plus its rounded tax.
  scenarios:
    - name: ordinary loyalty credit
      given: A 1000-cent subtotal, 200-cent loyalty credit and 10% tax.
      when: calculate_total runs.
      then: The taxable amount is 800 cents and the final total is 880 cents.
    - name: combined coupon and over-credit
      given: Coupon and loyalty credit reduce the taxable amount to zero or below.
      when: calculate_total runs.
      then: Tax and final total remain zero, never negative.
    - name: validation compatibility
      given: Existing invalid subtotal, coupon, loyalty or tax inputs.
      when: calculate_total validates them.
      then: Existing ValueError behavior and messages remain unchanged.
  risks:
    - Applying loyalty before coupon or after tax would preserve the original bug in another order.
    - Removing the pre-tax zero floor could calculate negative tax before the final floor.
  changeBudget:
    maxFiles: 1
    maxDiffLines: 20

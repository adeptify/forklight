<!--
THESIS: ForkLight opens on the user's work: what they want, what is moving, and what needs them next.
OWN-WORLD: A light GoalBoard-family workbench on a cool near-white field, white paper, graphite ink, and action blue. Surfaces stay flat; status color always has text.
STORY: Follow Goal, Plan, and Task as one visible tree, open the work that matters, and confirm decisions only from the one Decision Center.
FIRST VIEWPORT: A compact product bar with Work and Decision Center; the user's real work tree beside one readable result file. Configuration stays in quiet System access.
FORM: Compact product bar, resizable work tree, one result file, one Decision Center, auxiliary System.
FINISH: Coherent desktop and mobile panes, preserved reading context, and DESIGN.md written from this built world.
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<meta name="forklight-hub-control" content="__FORKLIGHT_HUB_CONTROL__">
<title>ForkLight</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">跳到主要内容</a>
<div class="shell">
  <header class="product-bar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg class="brand-mark-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M3 3.5h4.2v9H3.8V6.8H3V3.5zm5.8 0H13v2.2H9.8v1.6H13v2.2H9.8V12.5H8.8V3.5z" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">ForkLight</div>
        <div class="brand-sub" data-i18n="brandSub">执行工作台</div>
      </div>
    </div>

    <nav id="fl-tabs" class="nav" aria-label="Primary">
      <div class="nav-scroll">
        <button type="button" data-tab="work" class="nav-item active">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M2.5 3.5h11v2h-11zm0 3.5h7v2h-7zm0 3.5h11v2h-11z" fill="currentColor"/></svg>
          </span>
          <span class="nav-label" data-i18n="navWork">工作</span>
        </button>
        <button type="button" data-tab="decisions" class="nav-item">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 3.5h10v2H3zm0 3.5h7v2H3zm0 3.5h10v2H3z" fill="currentColor"/></svg>
          </span>
          <span class="nav-label" data-i18n="navDecisions">决定中心</span>
        </button>
      </div>
      <details id="fl-system-menu" class="system-menu">
        <summary class="nav-item system-summary">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 4h10v1.4H3zm0 3.3h10v1.4H3zm0 3.3h10V12H3z" fill="currentColor"/></svg>
          </span>
          <span class="nav-label" data-i18n="navSystem">系统</span>
        </summary>
        <div class="system-menu-list" role="group" aria-label="System">
          <button type="button" data-tab="model" class="nav-item">
            <span class="nav-label" data-i18n="navModels">模型</span>
          </button>
          <button type="button" data-tab="worker" class="nav-item">
            <span class="nav-label" data-i18n="navWorkers">Worker</span>
          </button>
          <button type="button" data-tab="mains" class="nav-item">
            <span class="nav-label" data-i18n="navMain">Main</span>
          </button>
          <button type="button" data-tab="delivery" class="nav-item">
            <span class="nav-label" data-i18n="navDelivery">Delivery</span>
          </button>
          <button type="button" data-tab="limits" class="nav-item">
            <span class="nav-label" data-i18n="navLimits">限额</span>
          </button>
          <button type="button" data-tab="competitions" class="nav-item">
            <span class="nav-label" data-i18n="navCompete">竞赛</span>
          </button>
          <button type="button" data-tab="stats" class="nav-item">
            <span class="nav-label" data-i18n="navInsights">洞察</span>
          </button>
          <div class="system-tray" data-fl-role="system-tray">
            <div class="theme-switch" role="group" aria-label="Theme">
              <span class="theme-label" data-i18n="theme">主题</span>
              <button type="button" class="theme-btn" data-theme-set="light" id="fl-theme-light">Light</button>
              <button type="button" class="theme-btn" data-theme-set="dark" id="fl-theme-dark">Dark</button>
            </div>
            <div class="lang-switch" role="group" aria-label="Language">
              <span class="lang-label" data-i18n="lang">语言</span>
              <button type="button" class="lang-btn" data-lang="zh" id="fl-lang-zh">中文</button>
              <button type="button" class="lang-btn" data-lang="en" id="fl-lang-en">EN</button>
            </div>
            <div id="fl-status-bar" class="conn-pill" aria-live="polite"></div>
          </div>
        </div>
      </details>
    </nav>
  </header>

  <div class="workspace">
    <header class="topbar">
      <button type="button" id="fl-mobile-back" class="btn sm mobile-back" hidden data-fl-role="mobile-back" data-i18n="mobileBack">返回</button>
      <div class="topbar-copy">
        <h1 id="fl-page-title" class="page-title">工作</h1>
        <p id="fl-page-sub" class="page-sub">看清想达成什么、现在进展到哪、接下来需要你做什么</p>
      </div>
      <div id="fl-top-meta" class="top-meta"></div>
    </header>
    <main id="main" class="content" tabindex="-1">
      <div id="fl-toast" class="toast" hidden role="status"></div>
      <div id="fl-flash-error" class="error-box" hidden role="alert"></div>
      <section id="fl-view" class="view" aria-live="polite"></section>
    </main>
    <footer id="fl-footer" class="footer"></footer>
  </div>
</div>
<section id="fl-detail" hidden role="dialog" aria-label="Details"></section>
<div id="fl-scrim" class="scrim" hidden aria-hidden="true"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>

<!--
THESIS: One Goal owns one working canvas. Refuse the global flat board that makes hierarchy look like telemetry.
OWN-WORLD: A quiet local workbench in bone, graphite, muted teal, and restrained status color; controls feel precise, not decorative.
STORY: Describe an outcome, let Main explain the right work shape, choose a Goal workspace, then follow its current phase and Task movement without losing context.
FIRST VIEWPORT: A compact outcome entry leads into a Goal rail and one focused board; one-off work and history remain nearby but secondary, with the next decision always visible.
FORM: Focused Goal workspace with a left context rail, fourth grounded structure, staged as one stable operating surface; seed 31d3080b.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>ForkLight</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">跳到主要内容</a>
<div class="shell">
  <aside class="sidebar" aria-label="Primary">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">FL</div>
      <div class="brand-text">
        <div class="brand-name">ForkLight</div>
        <div class="brand-sub" data-i18n="brandSub">控制中心</div>
      </div>
    </div>

    <div class="nav-group-label" data-i18n="navConfigure">配置</div>
    <nav id="fl-tabs" class="nav" aria-label="Sections">
      <button type="button" data-tab="model" class="nav-item">
        <span class="nav-icon" aria-hidden="true">1</span>
        <span class="nav-label" data-i18n="navModels">模型</span>
      </button>
      <button type="button" data-tab="worker" class="nav-item">
        <span class="nav-icon" aria-hidden="true">2</span>
        <span class="nav-label" data-i18n="navWorkers">Worker</span>
      </button>
      <button type="button" data-tab="mains" class="nav-item">
        <span class="nav-icon" aria-hidden="true">3</span>
        <span class="nav-label" data-i18n="navMain">Main</span>
      </button>
      <button type="button" data-tab="delivery" class="nav-item">
        <span class="nav-icon" aria-hidden="true">4</span>
        <span class="nav-label" data-i18n="navDelivery">Delivery</span>
      </button>

      <div class="nav-group-label" data-i18n="navOperate">运行</div>
      <button type="button" data-tab="work" class="nav-item active">
        <span class="nav-icon" aria-hidden="true">&#9638;</span>
        <span class="nav-label" data-i18n="navWork">工作</span>
      </button>
      <button type="button" data-tab="competitions" class="nav-item">
        <span class="nav-icon" aria-hidden="true">&#9733;</span>
        <span class="nav-label" data-i18n="navCompete">竞赛</span>
      </button>
      <button type="button" data-tab="stats" class="nav-item">
        <span class="nav-icon" aria-hidden="true">&#9641;</span>
        <span class="nav-label" data-i18n="navInsights">洞察</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="theme-switch" role="group" aria-label="Theme">
        <span class="theme-label" data-i18n="theme">主题</span>
        <button type="button" class="theme-btn" data-theme-set="light" id="fl-theme-light">Light</button>
        <button type="button" class="theme-btn" data-theme-set="dark" id="fl-theme-dark">Dark</button>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <span class="lang-label" data-i18n="lang">语言</span>
        <button type="button" class="lang-btn" data-lang="zh" id="fl-lang-zh">中文</button>
        <button type="button" class="lang-btn" data-lang="en" id="fl-lang-en">EN</button>
      </div>
      <div id="fl-status-bar" class="conn-pill" aria-live="polite"></div>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="topbar-copy">
        <h1 id="fl-page-title" class="page-title">工作</h1>
        <p id="fl-page-sub" class="page-sub">查看 Goal、独立 Plan 或一次性 Task 工作区，以及其中的工作</p>
      </div>
      <div id="fl-top-meta" class="top-meta"></div>
    </header>
    <main id="main" class="content" tabindex="-1">
      <div id="fl-toast" class="toast" hidden role="status"></div>
      <div id="fl-flash-error" class="error-box" hidden role="alert"></div>
      <section id="fl-view" class="view" aria-live="polite"></section>
    </main>
    <footer id="fl-footer" class="footer"></footer>
  </div>
</div>
<section id="fl-detail" hidden role="dialog" aria-label="Details"></section>
<div id="fl-scrim" class="scrim" hidden aria-hidden="true"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>

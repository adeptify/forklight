acceptance:
  criteria:
    - One explicit command creates a complete bundle only after real pack, isolated install, installed CLI/MCP/build checks, installed Hub/daemon identity checks, and clean shutdown pass.
    - Existing destinations and all failure cases remain untouched publicly; private staging and exact owned processes are cleaned without retries.
    - The tarball SHA and packaged/installed identity are exact, evidence is external and privacy-safe, and limitations never overclaim a clean-user run.
    - Tests cover planning, parsing, filename policy, identity mismatch, cleanup, atomic publish, and recursive-test prevention without invoking real ForkLight npm pack inside npm test.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/clean-run-bundle.test.ts tests/package.test.ts tests/hub-instance.test.ts
    - npm run build
    - npm run check
    - git diff --check

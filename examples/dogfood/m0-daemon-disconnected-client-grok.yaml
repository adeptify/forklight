acceptance:
  criteria:
    - A real disconnected local client cannot crash the daemon or cancel/duplicate its already-started asynchronous request.
    - Ordinary success and application-error responses retain their existing protocol behavior.
    - A later health request reaches the same daemon after the abandoned response resolves, and shutdown remains bounded.
    - Documentation distinguishes safe client re-query from still-unimplemented process-crash stage resumption.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/daemon.test.ts tests/integration-operation.test.ts
    - npm run build
    - npm run check
    - git diff --check

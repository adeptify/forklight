  generatedPaths: [.next/**]
worker:
  allowEdits: true
  allowedCommands: []
  focusPaths:
    - src/adapters/connectors/types.ts
    - src/adapters/connectors/gmail.ts
    - src/adapters/connectors/github.ts
    - src/application/connector-sync.ts
    - src/domain/types.ts
    - src/server/http.ts
    - tests/connectors-and-product.test.ts
    - tests/gmail-oauth.test.ts
acceptance:
  criteria:
    - Credentialed Gmail failures never produce or ingest fixtures and never advance cursor through the success branch.
    - Fixture mode remains usable only without credentials and persists mock status; Gmail live and GitHub success remain compatible.
    - Detail 503/malformed responses fail honestly, 404/410 may skip, and tests route detail payloads before generic list payloads.
    - Failure results and public errors contain no access/refresh token, client secret, raw body, or stack.
    - Full Relay lint, tests, and production build pass without commit or push.
  commands:
    - node --test --import tsx tests/gmail-oauth.test.ts tests/connectors-and-product.test.ts
    - npm run check
    - git diff --check

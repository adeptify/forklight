acceptance:
  criteria:
    - Strong-era and private-expression fixtures take different context paths using only user-provided evidence.
    - ContextAssessment is persisted atomically with FactSpine confirmation and remains optional for schema v1 compatibility.
    - Query coordinates never consume FactSpine inference or unresolved personal-gap text and never contain an invented historical fact.
    - No Provider, network, UI, Journey-status, or story-generation behavior is added in this slice.
    - Focused tests, complete Elsewhere check, production build, and diff hygiene pass from the captured 142-test baseline.
  commands:
    - pnpm vitest run tests/services/context-assessment.test.ts tests/services/journey-workflow.test.ts
    - pnpm check
    - pnpm build
    - git diff --check

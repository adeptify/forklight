acceptance:
  criteria:
    - Machine success alone is never accepted final delivery; current Main reject is a comparable non-acceptance.
    - Main accept, verified remediation, and legacy applied Integration are accepted once per Task with explicit precedence.
    - Missing/stale/external evidence is unavailable, not a synthetic failure or success.
    - Accepted-delivery scoring requires candidate-wide comparable sample coverage and preserves strict/flexible semantics.
    - Provider statistics, routing candidate cards, and bilingual copy use the same Main-backed meaning.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/statistics.test.ts tests/model-routing.test.ts tests/hub-ui-assets.test.ts
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - npm run check
    - git diff --check

acceptance:
  criteria:
    - Overview prioritizes live state, attention, and active work before completed setup, version, upgrade, sample, and system evidence.
    - Task Detail hero and four-section Overview answer what happened, whether it passed, Main input, Worker return, independent result, final output, and the single next action without repeating one fact as several primary cards.
    - Failed checks show a safe concrete failure summary when present and honest unavailable copy otherwise.
    - Safe journey output strips secrets, ANSI control codes, absolute home paths, unbounded logs, prompts, diffs, and environment dumps.
    - Worker self-report, retained Candidate, accepted output, and delivered output remain visibly distinct.
    - Existing tabs, actions, confirmation gates, themes, responsive shell, CLI/deep-audit evidence, and all non-Hub product semantics remain unchanged.
    - English and Chinese framing are independently readable, and original external content is visibly labelled.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/hub-settings.test.ts tests/hub-ui-assets.test.ts tests/hub-ops-mutations.test.ts
    - npm run check
    - npm run build
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - git diff --check

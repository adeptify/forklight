acceptance:
  criteria:
    - Exact failed-verification and Candidate bindings are durable, single-use, identically idempotent, conflict on change, and fail closed when malformed.
    - Attribution never changes machine status, verification, Main Review, Candidate, retry/reverify, remediation, final delivery, or Integration authority.
    - Terminal and first-pass routing/statistics consume only their own valid attribution; compact output is aggregate-only and privacy-safe.
    - CLI, daemon, MCP, and Hub record the same confirmation-gated evidence without Provider or Worker execution.
    - Hub plainly explains that the Task remains failed and whether this incident counts toward Worker ability in English and Chinese.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/main-failure-attribution.test.ts tests/statistics.test.ts tests/daemon.test.ts tests/mcp.test.ts tests/hub-settings.test.ts tests/hub-ui-assets.test.ts

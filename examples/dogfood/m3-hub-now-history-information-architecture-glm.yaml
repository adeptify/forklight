acceptance:
  criteria:
    - Canonical truth-table tests keep open work in Now and only proven closed outcomes in History.
    - Safe summaries and Hub API expose only closed placement codes and no new private text or paths.
    - Hub defaults to Now and composes Now/History/All with search and secondary filters without Task mutation.
    - History uses Delivered and Stopped end-to-end groups; repaired failures are delivered and Main rejection is stopped.
    - Existing lanes, cards, actions, Detail links, themes, and responsive shell remain compatible.
    - Chinese and English behavior tests use plain language, describe bounded history honestly, and keep lifecycle jargon out of primary copy.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/task-surface.test.ts tests/hub-settings.test.ts tests/hub-ui-assets.test.ts
    - npm run check
    - npm run build
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - git diff --check

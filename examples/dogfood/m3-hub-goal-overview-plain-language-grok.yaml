  allowedCommands: []
  focusPaths:
    - src/hub/public/app.js
    - src/hub/public/i18n.js
    - tests/hub-ui-assets.test.ts
acceptance:
  criteria:
    - Known stopped/completed Goal states and next actions use the selected language on overview, Goal list, and Goal Detail.
    - Unknown legacy codes preserve bounded stored text, while stopped is a first-class neutral status rather than unknown or failed.
    - Goal execution and API behavior remain unchanged.
  commands:
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/hub-ui-assets.test.ts
    - npm test
    - npm run build
    - git diff --check

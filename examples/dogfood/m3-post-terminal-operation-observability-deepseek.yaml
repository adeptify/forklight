  allowedCommands: []
  focusPaths:
    - src/core/types.ts
    - src/core/task-progress.ts
    - src/cli/supervision.ts
    - src/cli.ts
    - src/mcp/server.ts
    - src/hub/public
    - tests
acceptance:
  criteria:
    - Open Candidate and Main repair verification stages are derived only from unmatched durable starts on terminal Tasks; completion restores the current terminal result.
    - Original Task status, Board lane, headline result, failure category, Main decision, and final-delivery semantics remain unchanged.
    - Active versus quiet is event-age observation only; silence never becomes failure, retry, recovery, or permission to invoke a Worker.
    - CLI and MCP terminal wait consume canonical stage evidence and wait for completion or caller timeout instead of returning immediately on raw terminal status.
    - Board and Task Detail independently explain in plain Chinese and English that this is local follow-up verification without another Worker.
    - Latest-only and ordinary terminal projections remain conservative and backward-compatible.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/task-surface.test.ts tests/cli-supervision.test.ts tests/hub-ui-assets.test.ts
    - npm test
    - npm run build
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - git diff --check
deliveryProfileId: forklight-self-upgrade

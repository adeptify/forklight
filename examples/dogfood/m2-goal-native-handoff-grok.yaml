acceptance:
  criteria:
    - Main can directly retain selected paths and bounded gaps from one exact normal Goal Task Candidate and hand it to one different saved Worker without creating a Competition, rewriting the source Task, or weakening existing Competition handoff.
    - Direct handoff admits only a non-terminal Goal source that is failed-with-revision or succeeded-with-fresh-exact-Main-revise; active, accepted, rejected, integrated, stale, unsafe, same-Profile, non-launchable, duplicate, non-Goal, terminal-Goal, and successor sources fail before mutation or Worker cost.
    - Retained evidence, typed handoff, frozen destination and successor Task persist atomically; selected paths alone are byte-matched into a clean current-project baseline and recovery never duplicates handoff, Task, workspace, Attempt, or lineage.
    - Goal preserves its original Plan Task but uses the exact successor for machine, Review Graph, fresh Main-accept, exact Integration, evidence digest, in-flight/no-progress, restart and downstream queue-once behavior; source evidence cannot satisfy the gate after handoff.
    - Failed/interrupted successor returns control to Main without source fallback, automatic second handoff, retry, correction, review, decision, Integration, commit, or push.
    - CLI, MCP, Task Detail and Goal Detail provide explicit confirmation and bilingual explanation of retained work, source/destination Worker, current authority, evidence, failure and next action without private data or internal-first copy.
    - Existing Competition and no-handoff Goal behavior remains green; full tests, strict TypeScript, build, Hub JavaScript syntax and diff hygiene pass with no commit or push.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/goal.test.ts tests/competition.test.ts tests/candidate-revision.test.ts tests/daemon.test.ts tests/review-graph.test.ts tests/integration.test.ts tests/mcp.test.ts tests/hub-ops-mutations.test.ts tests/hub-ui-assets.test.ts
    - npm test
    - npm run build
    - node --check src/hub/public/app.js && node --check src/hub/public/i18n.js
    - git diff --check

acceptance:
  criteria:
    - A slow detached runner produces one durable terminal result without a second runner, retry, or fake success.
    - Early observer timeout remains outcome-unknown and never starts or replaces a daemon.
    - Success, assertion failure, activation failure, and delayed completion all leave zero fixture-owned process/socket/home residue.
    - Cleanup authority is limited to the exact fixture home and exact created/adopted PIDs; no user daemon or untracked process can be signalled.
    - Production authorization, one-use handoff, observer read-only behavior, privacy, and fail-closed evidence remain unchanged.
  commands:
    - for i in 1 2 3; do node --disable-warning=ExperimentalWarning --test --import tsx --test-name-pattern='detached activation completes|integration starts non-blocking' tests/integration-operation.test.ts || exit 1; done
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/activation.test.ts tests/integration-operation.test.ts tests/detached-daemon-fixture.test.ts tests/daemon-cli.test.ts
    - npm test
    - npm run build
    - git diff --check

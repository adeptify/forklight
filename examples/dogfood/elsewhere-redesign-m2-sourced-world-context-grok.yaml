    - The strong Hangzhou Demo fixture returns exactly the three declared official records; private and unrelated fixtures never receive fabricated history.
    - Same-assessment cache reuse, explicit refresh, stale invalidation, abort, missing-port, thrown-error, empty, invalid-source, and conflict behavior are deterministic and privacy-safe.
    - Existing schema-v1 records, Journey status transitions, AI generation inputs, UI, Provider calls, and current full product behavior remain unchanged.
    - Focused tests, complete Elsewhere check, production build, and diff hygiene pass from the current 156-test baseline.

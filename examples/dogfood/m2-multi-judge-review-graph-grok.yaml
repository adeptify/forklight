acceptance:
  criteria:
    - One exact Candidate Revision accepts an explicit ordered set of one through three unique saved Worker Profiles and atomically registers all read-only reviewer Tasks before queueing.
    - The graph remains non-terminal until every assignment is terminal; then it preserves all useful/failing evidence and projects pending, single-opinion, agreement, disagreement, or insufficient-evidence without automatic voting or retry.
    - Pending review and complete terminal review evidence require the correct fresh Main decision before Integration; no judge can integrate or mutate the Candidate.
    - Duplicate same-set create is idempotent, changed/reordered sets reject before mutation, restart is duplicate-safe, and one-item callers remain compatible.
    - CLI, MCP, and Hub create/status and Task Detail explain plural judges, each result/failure, aggregate state, and next Main action in plain English and Chinese without exposing raw/private content.
    - The complete repository remains green and no commit or push occurs.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/review-graph.test.ts tests/integration.test.ts tests/goal.test.ts tests/mcp.test.ts tests/hub-ops-mutations.test.ts tests/hub-ui-assets.test.ts
    - npm test
    - npm run build
    - node --check src/hub/public/app.js && node --check src/hub/public/i18n.js
    - git diff --check

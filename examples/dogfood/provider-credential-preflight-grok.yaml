version: 2
name: Stop calling unreadable Provider credentials launchable
project: ../..
taskClass: forklight-provider-credential-launch-preflight
directCodexProfileId: codex-cli-gpt-5.6-sol-xhigh
workerProfileId: local-grok-builder
deliveryProfileId: forklight-self-upgrade
contract:
  outcome: >-
    ForkLight distinguishes a merely located Keychain item from authentication
    that the Daemon can actually read, stops calling an unreadable Provider
    launchable, and fails a queued Task before workspace preparation or Worker
    Attempt creation with one clear authentication action. No secret value is
    returned, logged, persisted, or loaded into the readiness check.
  presentation:
    summary: 如果 Keychain 里虽然有记录、但 ForkLight 无法读取，Hub 和任务启动前检查都要直接说明“需要重新授权”，不能先显示可用、再浪费一次 Worker 启动。
    language: zh-CN
  context:
    - Real MiniMax Task 7b8c6d1b-d396-4ec5-b62d-fefc05c954c0 was accepted by readiness, prepared a complete isolated workspace, then failed before turn 1 because `security ... -w` could not read `forklight.minimax.api-key`.
    - Current providerReadiness calls `security find-generic-password` without `-w`, so it proves only that an item is located. Claude/Grok Worker launch later requires the credential value and can fail under a different Keychain access-control result.
    - The readiness projection is privacy-safe and already drives daemon health plus Hub Worker cards. The coordinator has one common execution entry before workspace preparation for normal Tasks, Plans, Competitions, resumes, and corrections.
    - xAI/Grok may authenticate either with a readable Keychain API key or the existing readable local Grok sign-in. That path must remain valid.
  inScope:
    - >-
      Replace the real Keychain readiness check with a non-materializing
      readability check: execute the exact account/service `security
      find-generic-password ... -w` operation with all output discarded and
      return only a boolean. Never capture the credential string for readiness.
    - Keep the injectable ProviderAuthInspector seam deterministic. Rename or extend its bounded method so tests distinguish located-but-unreadable from actually readable without passing secret values.
    - Make providerReadiness.ready/authMode mean the Daemon can use an authentication path at launch. For non-xAI API Providers, a located but unreadable item is not ready and receives a bounded re-authorize action/reason; xAI remains ready when either its Keychain item is readable or local Grok sign-in is readable.
    - Add one canonical Task launch-auth preflight that consumes the frozen Task Provider/runtime identity and checks the exact service/account without returning a secret. Run it at the coordinator's common execution boundary before any workspace scan/copy, Attempt record, Worker process, Provider request, or Token usage.
    - When the preflight fails, move the Task to a truthful terminal authentication failure with one bounded user-facing reason/action and a durable event. Preserve immutable Task/Plan/Competition history and let existing reconciliation observe the terminal result; do not auto-retry or adapt.
    - Retain the existing Worker-side `readProviderKey` as a final defensive check because access can change after preflight. Do not weaken sandboxing, secret injection, or runtime-specific authentication.
    - Add deterministic tests for readable, located-but-unreadable, absent, custom account/service, xAI local sign-in fallback, zero workspace/Attempt/Worker mutation, Plan/Competition reconciliation compatibility, privacy, and no retry.
  outOfScope:
    - Reading, writing, deleting, migrating, displaying, or repairing a Keychain value; Provider probes; billable requests; changing API keys; opening a system prompt; Hub redesign; Doctor redesign; Task Contract preview redesign; model routing; competition policy; retry/correction/adaptation policy; Integration; commit; or push.
    - Capturing the credential output merely to test it, storing a readable boolean beyond the existing bounded status snapshot, treating local authentication as a verified Provider connection, or permanently penalizing a model for authentication failure.
    - Preventing Task registration entirely. The Task may exist so Task Detail can explain the failure, but execution must stop before workspace preparation and before an Attempt.
  executionSteps:
    - Trace providerReadiness, readProviderKey, Grok OAuth fallback, coordinator common execute boundary, preparation events, failure categorization, and directly relevant tests before editing.
    - Implement and test the non-materializing readable-credential predicate and safe readiness semantics first.
    - Add the common launch-auth preflight before every execution branch and persist a bounded authentication failure without creating an Attempt or workspace.
    - Prove normal readable API-key and Grok local-sign-in paths still reach the existing preparation/runner flow, and that Plan/Competition reconciliation is not bypassed.
    - Run focused and full acceptance once. Report baseline failures to Main rather than expanding scope or retrying.
  deliverables:
    - Privacy-safe readable-auth predicate shared by readiness and Task launch preflight.
    - Truthful Provider/Worker readiness for unreadable Keychain records.
    - Pre-workspace terminal authentication failure with one next action and no Attempt/Token spend.
    - Deterministic regressions for all supported authentication paths and lifecycle boundaries.
  modules:
    - name: Provider authentication readability
      responsibility: Decide whether an exact local authentication path is usable without materializing or returning credential data.
      consumes:
        - Provider name, exact Keychain service/account, discarded-output `security -w` exit status, and existing Grok local-sign-in predicate.
      produces:
        - Bounded readable flag, authentication mode, and reason/action code.
      boundaries:
        - No secret output capture, credential value, Provider network request, persistence, raw security error, private path, or account/service in beginner text.
    - name: Common Task launch preflight
      responsibility: Stop an unauthenticated Task before expensive preparation or a model Attempt while leaving a truthful inspectable terminal record.
      consumes:
        - Frozen Task Provider/runtime identity and the bounded authentication readability result.
      produces:
        - Existing execution flow for usable authentication, or one terminal authentication failure event and next action.
      boundaries:
        - Runs before workspace/Attempt/Worker/Provider activity; no retry, adaptation, Task rewrite, model-quality penalty, or Integration authority.
  callChain:
    - Daemon health and Hub Worker readiness ask the canonical authentication inspector whether the selected local auth path is actually readable, without receiving the secret.
    - A submitted Task reaches the coordinator's shared execution boundary with its frozen Provider/runtime/service/account.
    - The launch preflight checks that exact auth path before branching into normal, Plan, Competition, resume, or correction execution.
    - Usable authentication continues unchanged into workspace preparation and the Worker's final defensive credential read; unusable authentication records one terminal failure and returns before any workspace or Attempt exists.
    - Task Detail and plan/competition reconciliation consume the ordinary terminal Task/event facts; no automatic retry is scheduled.
  scenarios:
    - name: Keychain item exists but cannot be read
      given: A MiniMax item is locatable without `-w`, but the exact discarded-output `-w` check fails.
      when: Health resolves and a Task is submitted.
      then: MiniMax is not called launchable; the Task ends before workspace preparation and Attempt 1 with an authentication/re-authorize action and zero Worker usage.
    - name: Readable API key
      given: The exact configured account and service pass the discarded-output readability check.
      when: Readiness and Task launch preflight run.
      then: The Provider is locally launchable and execution proceeds to the unchanged workspace/Worker flow without the preflight reading or exposing the key.
    - name: Grok local sign-in fallback
      given: xAI Keychain is absent or unreadable, but the existing local Grok sign-in is readable.
      when: A grok-build Task reaches the preflight.
      then: It remains launchable through local-sign-in and the existing task-local OAuth seeding path continues unchanged.
    - name: Authentication changes after preflight
      given: Readability passes and is then revoked before the Worker performs its final credential read.
      when: Worker launch continues.
      then: The existing Worker-side defensive failure remains authoritative; ForkLight does not reuse a cached secret or retry automatically.
  risks:
    - Capturing stdout would unnecessarily materialize a secret, so the check must rely only on exit status with stdout/stderr discarded.
    - Placing the check inside only submit_file would miss inline, Plan, Competition, resume, and correction paths, so it belongs at their common execution boundary.
    - Removing the Worker-side read would create a time-of-check/time-of-use hole, so the preflight is an early truth check, not the only authority.
    - Authentication failure is environment evidence, not model-quality evidence; statistics and routing must keep that failure category separate.
  changeBudget:
    maxFiles: 7
    maxDiffLines: 900
advancedPolicy:
  maxDurationMs: null
  observedTokenCeiling: null
  noProgressTimeoutMs: 1800000
  workerStopGraceMs: 10000
  fileLimit: null
  fileLimitMode: warn
  changedLineLimit: null
  changedLineLimitMode: warn
  baseMaxAttempts: 1
  maxExtraAttempts: 0
  maxMainCorrections: 0
  maxMainReverifications: 0
  maxConcurrency: 1
  completionMode: warn
  changeBudgetMode: warn
  maxAdaptationRounds: 0
workspace:
  exclude:
    - .git
    - node_modules
    - dist
    - .forklight-dev
    - .forklight-daemon-test
  generatedPaths:
    - dist/**
worker:
  allowEdits: true
  allowedCommands: []
  focusPaths:
    - src/core/providers.ts
    - src/core/secrets.ts
    - src/daemon/coordinator.ts
    - src/core/runner.ts
    - tests/providers.test.ts
    - tests/daemon.test.ts
    - tests/worker-readiness.test.ts
acceptance:
  criteria:
    - API-key readiness proves the exact Keychain item is readable via discarded-output exit status, not merely locatable; no readiness or preflight code captures, returns, logs, or persists credential content.
    - The exact frozen Task authentication path is checked at the shared execution boundary; failure creates no workspace-preparation event/artifact, Attempt, Worker process, Provider request, usage, retry, correction, or adaptation.
    - xAI remains launchable through either a readable API key or the existing readable local Grok sign-in; valid API-key Providers continue into the unchanged runner and retain the final defensive read.
    - Authentication failures are bounded, user-actionable, privacy-safe, terminal, and categorized separately from model quality while Plan/Competition reconciliation remains correct.
    - Focused Provider/readiness/daemon behavior, full tests, strict TypeScript, production build, and diff validation pass.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/providers.test.ts tests/worker-readiness.test.ts tests/daemon.test.ts
    - npm test
    - npx tsc -p tsconfig.json --noEmit --noUnusedLocals --noUnusedParameters
    - npm run build
    - git diff --check

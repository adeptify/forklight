    - src/core/review-graph.ts
    - src/core/main-review.ts
    - src/core/integration.ts
    - src/core/types.ts
    - src/state/store.ts
    - src/daemon/coordinator.ts
    - src/daemon/protocol.ts
    - src/daemon/server.ts
    - src/cli.ts
    - src/mcp/server.ts
    - src/hub/server.ts
    - src/hub/public/app.js
    - src/hub/public/i18n.js
    - tests/goal.test.ts
    - tests/daemon.test.ts
    - tests/review-graph.test.ts
    - tests/integration.test.ts
    - tests/hub-ui-assets.test.ts
    - tests/hub-ops-mutations.test.ts
acceptance:
  criteria:
    - A Goal milestone keeps its original Plan Task immutable but follows exactly one durable authorized handoff successor as its effective Task for machine, fresh Main-accept, Review Graph, and exact Integration gates.
    - Successor Attempt, verification, revision, review graph, Main decision, Integration and handoff status drive the Goal evidence digest and no-progress logic; raw Worker messages and polling still do not count as progress.
    - In-flight successor/reviewer work prevents false idle stop; restart preserves the same lineage and downstream admission occurs once only after the effective gate is truly satisfied.
    - Failed/interrupted successor returns a bounded truthful Main action without source fallback, second handoff, retry, correction, automatic review/decision/Integration, or history rewrite.
    - CLI, MCP, and bilingual Hub Goal Detail explain original Worker, successor Worker, retained work, current authority, evidence and next action without private content or internal-first copy.
    - Milestones without handoff and non-Goal Plan/Task behavior retain their existing meaning; the complete repository remains green and no commit or push occurs.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/goal.test.ts tests/daemon.test.ts tests/review-graph.test.ts tests/integration.test.ts tests/hub-ui-assets.test.ts tests/hub-ops-mutations.test.ts
    - npm test
    - npm run build
    - node --check src/hub/public/app.js && node --check src/hub/public/i18n.js
    - git diff --check

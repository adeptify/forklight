acceptance:
  criteria:
    - Main may amend only exact failed commands from the latest verification after an exact bound revise review; passing commands and original evidence remain immutable.
    - A passing amended suite records verified-repaired-delivered with amended-acceptance basis while adding no Worker Attempt, model usage, source mutation, Integration, commit, or push.
    - CLI, daemon, and MCP carry the amendment without exposing command text, paths, reason text, or outputs in public projections or exchange receipts.
    - Task Detail explains the dual outcome in plain English and Chinese, and statistics preserve machine failure without blaming model quality after verified amended delivery.
    - Normal remediation, candidate reverify, Worker correction, legacy records, and existing Integration authority remain compatible.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/main-remediation.test.ts tests/daemon.test.ts tests/mcp.test.ts tests/hub-settings.test.ts tests/hub-ui-assets.test.ts tests/statistics.test.ts
    - npm run build
    - node --check src/hub/public/app.js && node --check src/hub/public/i18n.js
    - git diff --check


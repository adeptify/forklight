acceptance:
  criteria:
    - History includes only canonical boardScope history records and excludes machine-terminal Tasks still awaiting Main or Integration.
    - Query and cursor validation is bounded and privacy-safe; equal timestamps page deterministically without duplication or omission.
    - Recent and History Hub responses share one compact allowlist and expose no new private content.
    - The History endpoint is absent from PAGE_DEPS and all automatic polling; selection/search/refresh/load-more are explicit and single-flight.
    - Search submits rather than requests per keystroke; late responses cannot overwrite a newer query.
    - Later-page failure retains loaded records, first-page failure is not shown as empty, and loaded versus total counts are honest.
    - Chinese and English primary copy is ordinary language, keyboard accessible, and controls wrap without page overflow near 390px.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/task-surface.test.ts tests/daemon.test.ts tests/hub-settings.test.ts tests/hub-ui-assets.test.ts
    - npm run check
    - npm run build
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - git diff --check

contract:
  outcome: >-
    The Hub keeps its small frequently refreshed operational Task slice, while
    an explicitly opened History view can safely search and page through every
    canonically closed Task without archive polling or lifecycle mutation.
  presentation:
    summary: 近期工作继续轻量刷新；只有用户打开历史时才查完整记录，并能搜索、继续加载和看懂失败状态。
    language: zh-CN
  context:
    - Follow docs/m3-hub-durable-history-pagination-contract.md as the Main-owned product and semantics authority.
    - The current Hub loads at most 50 Task summaries and its History search only covers that loaded subset.
    - Canonical boardScope and boardReason already distinguish finished product outcomes from machine-only status.
    - Keep all current uncommitted ForkLight work as the baseline; do not revert or overwrite unrelated changes.
    - Do not touch Elsewhere, client-core, Adeptify, or another consumer App.
  inScope:
    - Add a read-only daemon History-page operation with bounded validated query, deterministic opaque cursor, total count, and canonical History filtering.
    - Reuse or factor the Hub compact Task allowlist so recent and History responses have identical privacy boundaries.
    - Add an explicit Hub History loader with submitted search, Refresh, Load more, de-duplication, stale-response protection, and retained-data error handling.
    - Keep the archive endpoint outside global PAGE_DEPS and every automatic polling path.
    - Add natural Chinese and English copy, 390px-safe styles, and focused protocol/Core/API/UI tests.
  outOfScope:
    - Task mutation, schema migration, retention, delete/archive actions, infinite scroll, automatic archive polling, automatic retry, or loading all pages.
    - Task Detail/card redesign, workflow semantics in JavaScript, Provider/routing/settings/economics changes, new dependencies, other Apps, commit, or push.
    - Searching or returning prompts, commands, outputs, errors, diffs, paths, event payloads, credentials, or free-text review reasons.
  executionSteps:
    - Trace listTasks, canonical Task surface projection, daemon protocol, Hub allowlist, board scope state, refresh planning, i18n, and focused tests.
    - Implement and test deterministic History paging and fail-closed cursor/query validation before wiring the Hub.
    - Add explicit History loading and honest loaded/total/error states without changing automatic refresh planning.
    - Run every stored acceptance command once and report unrelated failures separately.
  deliverables:
    - One bounded privacy-safe daemon History-page contract with stable continuation.
    - One Hub History interaction that finds older deliveries without background archive polling.
    - Plain bilingual copy and focused regression evidence for paging, privacy, failures, and responsive controls.
  modules:
    - name: Durable History read model
      responsibility: Select canonical closed outcomes and return one deterministic bounded page.
      consumes:
        - Stored terminal Tasks and existing canonical Task surface evidence.
      produces:
        - Safe History items, totalCount, hasMore, and opaque nextCursor.
      boundaries:
        - Read-only; search safe facts only; no Task mutation, raw private fields, or client-side lifecycle inference.
    - name: Hub privacy adapter
      responsibility: Give recent Tasks and History one compact public allowlist.
      consumes:
        - Safe Task summaries from the daemon.
      produces:
        - Consistent browser-safe Task records and bounded History metadata.
      boundaries:
        - No prompt, command, output, path, session, credential, diff, event payload, or free-text reason.
    - name: Deliberate History interaction
      responsibility: Load, search, refresh, and extend History only when the user asks.
      consumes:
        - History pages and current scope/search interaction.
      produces:
        - De-duplicated records, honest loaded/total state, retained-data errors, and accessible controls.
      boundaries:
        - No PAGE_DEPS archive slice, polling, per-keystroke requests, infinite scroll, automatic retry, or broad board redesign.
  callChain:
    - The user selects History or explicitly submits a History search.
    - Hub calls the new read-only daemon operation with a bounded query and optional opaque continuation.
    - Core derives canonical Task surfaces, keeps only History, applies safe search and deterministic pagination.
    - Hub projects the same compact Task allowlist used by recent Tasks and returns page metadata.
    - The browser replaces or appends the current generation, de-duplicates by Task id, and renders honest loaded/total/error state.
  scenarios:
    - name: Older delivery found
      given: A canonical delivered Task lies outside the recent 50 loaded Tasks.
      when: The user opens History and submits a matching search.
      then: The Task appears without loading the entire archive or changing Task state.
    - name: Concurrent insert
      given: The first page was loaded and a newer Task is then inserted.
      when: Load more uses the issued cursor.
      then: Previously returned Tasks are not duplicated and the continuation order remains stable.
    - name: Search changed
      given: A cursor was issued for one normalized query.
      when: It is sent with a different query.
      then: The daemon rejects it with fixed privacy-safe language.
    - name: Later page unavailable
      given: The user already sees one or more History pages.
      when: Load more fails.
      then: Existing records remain visible, are marked possibly stale, and a retry action is offered.
    - name: Ordinary polling
      given: The user stays on Now, another page, or a hidden tab.
      when: Normal refresh runs.
      then: No History-page request occurs.
  risks:
    - A cursor based only on timestamp can duplicate or omit equal-time Tasks; bind timestamp and Task id.
    - Reusing the live search input would send per-keystroke requests; keep draft and submitted query separate.
    - A separate Hub mapping can leak or drift; share the compact allowlist projection.
    - Replacing loaded data on a transient error makes failure look like an empty archive; preserve prior pages.

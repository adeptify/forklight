version: 2
name: Explain terminal Task attempts that still carry a running record
project: /Users/yijunwang/code/forklight
taskClass: forklight-hub-terminal-attempt-truth
taskFamily: bounded-hub-presentation
directCodexProfileId: codex-cli-gpt-5.6-sol-xhigh
workerProfileId: local-grok-builder
deliveryProfileId: forklight-self-upgrade
routingDecision:
  taskFamily: bounded-hub-presentation
  shortlist:
    - provider: xai
      model: grok-4.5
      runtime: grok-build
      effort: high
      workerProfileId: local-grok-builder
    - provider: deepseek

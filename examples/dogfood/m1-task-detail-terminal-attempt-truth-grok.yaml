    - src/hub/public/app.js
    - src/hub/public/i18n.js
    - tests/hub-settings.test.ts
    - tests/hub-ui-assets.test.ts
acceptance:
  criteria:
    - >-
      Terminal parent Tasks never present an exact Attempt as still running when
      ordered same-Attempt durable events prove it ended.
    - >-
      The post-Worker finalization case is derived without raw summary parsing;
      genuine active and unrelated-Attempt cases remain fail-closed.
    - >-
      English and Chinese Task Detail renderers share the same evidence meaning,
      and remediation remains separate from original Worker/Task status.
    - No execution, persistence, retry, verification, Integration, or routing behavior changes.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/hub-settings.test.ts tests/hub-ui-assets.test.ts
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - npm test
    - npm run build
    - git diff --check

acceptance:
  criteria:
    - One explicit confirmed operation hands one exact retained Candidate to one different saved Worker by creating exactly one durable successor Task and never mutating the source Task, Candidate, Competition evidence or Attempts.
    - The successor baseline is the current project snapshot; only Main-approved whole reusable paths are imported and byte-matched to the exact Candidate, while non-reusable Candidate paths remain absent and the final successor Diff is complete for ordinary Integration.
    - Destination Worker identity/effective policy, exact source revision/digest, Gap Contract and one-hop lineage are frozen; stale, unsafe, duplicate, same-Profile, non-launchable, final-choice and successor-source requests fail before Worker launch.
    - Preparation and queue admission recover across Daemon restart without duplicate handoff, Task, materialization or Attempt; preparation failure launches no Worker and preserves readable evidence.
    - The successor uses ordinary independent verification, fresh Main review and Integration boundaries; no inherited accept, auto-review, auto-retry, auto-routing, auto-Integration, commit or push exists.
    - CLI, MCP and Hub/Task Detail expose the confirmed operation and bilingual input-process-output-next story without raw patch, prompt, logs, credentials, endpoint, private path or false Token-savings language.
    - Full repository tests, strict TypeScript, build, Hub JavaScript syntax and diff hygiene pass; no commit or push occurs.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/competition.test.ts tests/candidate-revision.test.ts tests/daemon.test.ts tests/integration.test.ts tests/mcp.test.ts tests/hub-ops-mutations.test.ts tests/hub-ui-assets.test.ts
    - npm test
    - npm run build
    - node --check src/hub/public/app.js && node --check src/hub/public/i18n.js
    - git diff --check

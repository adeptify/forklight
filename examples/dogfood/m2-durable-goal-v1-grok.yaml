acceptance:
  criteria:
    - One Goal atomically supervises exactly four through eight existing Plan Tasks with frozen policy, explicit milestone gates, durable evidence/status, and no duplicate scheduler or pre-validation mutation.
    - Goal dependency readiness supports machine, fresh exact Main accept, and successful exact Integration gates; downstream work starts once only after its configured evidence and existing non-Goal Plans keep their current behavior.
    - maxDurationMs null stays unlimited across persistence/restart while correction, review, and explicit no-new-evidence cycles remain finitely bounded and stop or wait without automatic replacement work.
    - Daemon restart preserves the exact Goal/Plan/Task/milestone/evidence state and resumes eligible ordinary Task work without duplicate Task, Attempt, review, decision, or Integration mutation.
    - CLI, MCP, and Hub support submit/status/advance/stop with explicit confirmation for mutations, and Goal Detail explains objective, current milestone, actual Worker, evidence, blocker/stop cause, and next Main action in plain English and Chinese.
    - Goal never edits a Candidate, makes a Main decision, launches undeclared work, corrects/reviews/integrates automatically, commits, pushes, or exposes raw/private content.
    - The complete existing repository remains green and no commit or push occurs.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/goal.test.ts tests/plan.test.ts tests/board.test.ts tests/daemon.test.ts tests/integration.test.ts tests/review-graph.test.ts tests/mcp.test.ts tests/hub-ops-mutations.test.ts tests/hub-ui-assets.test.ts
    - npm test
    - npm run build
    - node --check src/hub/public/app.js && node --check src/hub/public/i18n.js
    - git diff --check

acceptance:
  criteria:
    - Stable screen projection and archive reopen never start a Provider call; each async call follows one explicit user intent and preserves confirmed work.
    - Ready substantive evidence requires persisted explicit choices for every displayed item before direction planning; private, atmosphere, unavailable, and all-rejected paths stay honest and generatable.
    - Direction preview resolves only current human-readable personal/source trace and never exposes IDs, scores, raw arrays, model terms, queries, reason codes, or prediction language.
    - Chinese and English surfaces preserve heading focus, radio-group semantics, source disclosure, live save status, keyboard access, reduced motion, 200% text zoom viability, and 860x640 reachability.
    - Existing M0-M1 shell, archive, FactMirror, generation, story, letter, settings, legacy records, and accepted backend work remain compatible.
  commands:
    - pnpm vitest run tests/app/App.test.tsx tests/demo/m0-m1-walkthrough.test.ts
    - pnpm check
    - pnpm build
    - git diff --check

acceptance:
  criteria:
    - Immediate health reads reuse one complete expensive environment snapshot without changing public response fields.
    - TTL expiry and Settings update/reset refresh Provider-default-dependent facts exactly once.
    - PID, build, queue, Provider verification, default Runtime, and max concurrency remain fresh on every response.
    - No credential value, cache metadata, retry, timeout increase, Provider request, lifecycle mutation, commit, or push is introduced.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/daemon-health-environment.test.ts tests/daemon.test.ts tests/cli-health.test.ts tests/setup-doctor.test.ts tests/hub-settings.test.ts
    - npm test
    - npm run build
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - git diff --check

deliveryProfiles:
  defaultProfileId: null
  profiles:
    - id: forklight-self-upgrade
      label: ForkLight self-upgrade
      buildCommands:
        - npm run build
      activationCommands:
        # Fail-closed handoff: validated stop then one bounded start. The stop
        # path authorizes one-use handoff shutdown with restart intent and
        # endpoint-only relinquishment; start launches exactly one child and
        # returns confirmed health (or a truthful timeout/exit). Do not poll
        # status or paper over start with retries.
        - >-
          node dist/src/cli.js daemon stop && node dist/src/cli.js daemon start --startup-timeout-ms 60000
      activationCheckCommands:
        - >-
          node dist/src/cli.js health --json | node -e 'let data=""; process.stdin.setEncoding("utf8"); process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => { const value = JSON.parse(data); if (value.identityStatus !== "matched") process.exit(1); });'
  projectBindings:
    /Users/yijunwang/code/forklight: forklight-self-upgrade

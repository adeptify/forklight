  allowedCommands: []
  focusPaths:
    - tests/hub-cli.test.ts
    - tests/helpers/detached-daemon.ts
    - tests/detached-daemon-fixture.test.ts
    - src/hub/instance.ts
    - src/daemon/client.ts
acceptance:
  criteria:
    - JSON and human detached Hub tests prove their exact Hub child, daemon owner, socket, and home are gone after success, timeout, or thrown assertion.
    - Cleanup stops/proves the Hub before adopting the exclusive-home daemon, never signals an untracked owner, and never swallows proof failure.
    - Startup timeout, privacy-safe output, no-open, single-launch, Hub ownership, and production lifecycle semantics remain unchanged.
    - No global sweep, test retry, reduced concurrency, Provider call, user-home access, commit, or push is introduced.
  commands:
    - for i in 1 2 3; do node --disable-warning=ExperimentalWarning --test --import tsx tests/hub-cli.test.ts tests/detached-daemon-fixture.test.ts || exit 1; done
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/hub-cli.test.ts tests/detached-daemon-fixture.test.ts tests/daemon-cli.test.ts tests/hub-instance.test.ts
    - npm test
    - npm run build
    - git diff --check

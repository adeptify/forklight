  modules:
    - name: Project status evidence
      responsibility: Keep the current runtime identity and milestone truth concise and current.
      consumes:
        - Verified build, Hub, Task, Integration, test, and live-statistics facts supplied by Main.
      produces:
        - Updated runtime paragraph and one dated M3 evidence section.
      boundaries:
        - Does not declare M1, M3, M4, or M5 complete and does not rewrite historical runtime sections.
    - name: Dogfood evidence log
      responsibility: Preserve the defect story, bounded fix, review decision, activation result, and evidence limitations.
      consumes:
        - Before/after cohort numbers, Candidate identity, verification facts, and cost availability.
      produces:
        - One readable append-only dogfood entry.
      boundaries:
        - No fabricated Token count, Provider bill, Main savings, commit, push, or model-wide conclusion.
  callChain:
    - Main supplies exact immutable Task, Candidate, Integration, build, Hub, and live-statistics evidence.
    - Worker updates the current project status and appends the dogfood story without changing source behavior.
    - Independent text checks verify required facts and evidence boundaries before Main review.
  scenarios:
    - name: Explain overlapping delivery paths
      given: The cohort has 11 machine successes and 8 Main-repaired Tasks with two Tasks in both sets.
      when: the result is documented.
      then: the text explains that the unique union is 17 of 18 rather than adding to 19, and explicitly says failure history remains.
    - name: Avoid false economic claims
      given: Grok reports only a runtime estimate and no complete usage.
      when: cost evidence is recorded.
      then: the estimate is labeled non-official, Worker Tokens remain unavailable, and no Main-Token savings are claimed without an exact-pair baseline.
    - name: Keep milestone exits honest
      given: One statistics defect is closed but representative project samples and external-user evidence remain open.
      when: status is updated.
      then: M3 evidence correctness is improved while M1, M3 sample collection, M4 exact-pair, and M5 external-user exits remain open.
  risks:
    - Replacing historical runtime identities would corrupt the audit trail; update only the explicitly current paragraph and append new evidence.
    - Presenting 94.4 percent as a model verdict would overgeneralize a mixed cohort; describe it only as the corrected recorded cohort.
    - Treating runtime estimate as billed cost or inferring saved Main Tokens would overclaim missing evidence.

version: 2
name: Separate unknown routing evidence from a reasoned Main Worker decision
project: /Users/yijunwang/code/forklight
taskClass: forklight-model-routing-decision-evidence
directCodexProfileId: codex-cli-gpt-5.6-sol-xhigh
workerProfileId: default

contract:
  outcome: >-
    Before a Worker starts, ForkLight freezes what kind of work Main believes
    this is, which resolved Workers Main considered, which one Main selected,
    what evidence was actually available, and why Main did or did not consider
    a Competition. Missing evidence must mean unknown rather than automatically
    suggesting extra Worker spend, and Hub must explain the decision in plain
    English and Chinese.
  presentation:
    summary: 没有样本只表示“还不知道”；Main 说明选谁、为什么选、为什么不竞争，Hub 用白话展示。
    language: zh-CN
  context:
    - The aligned design source is docs/model-selection-strategy-v1.md and the UI/data acceptance source is docs/model-selection-ux-acceptance-v1.md.
    - Current routing compares provider/model only and returns shouldRunCompetition=true when every candidate has zero relevant samples because uncertainty is coupled directly to competitionOnUncertainty.
    - Current exact taskClass evidence is fragmented. A stable explicit taskFamily may provide broader evidence, but it must never replace exact taskClass for audit or Direct Codex Token calibration.
    - A Worker identity for comparison is the frozen provider, model, runtime, and effort. workerProfileId is provenance only and later settings edits must not rewrite history.
    - Main is still authoritative. Routing remains read-only advice and this Task must not auto-submit, auto-switch a Worker, start a Competition, retry, adapt settings, integrate, commit, or push.
    - Preserve every existing unrelated worktree change. Do not simplify the design to provider/model compatibility merely to reduce implementation size.
  inScope:
    - Add optional validated taskFamily and immutable routingDecision data to new Tasks while keeping legacy Tasks readable without inference or backfill.
    - Freeze the resolved shortlist and selected Worker as provider, model, runtime, effort, and optional Worker Profile provenance; reject identity drift before Worker launch.
    - Store a bounded structured Main selection reason, competition intent, explicit triggers, and the evidence snapshot used at Task creation.
    - Derive comparable statistics first for exact taskClass, then for one explicit taskFamily only when every candidate meets the configured family sample threshold; otherwise return unknown with evidenceScope none.
    - Return knowledge recommendation or unknown separately from competition advice. Evidence absence or a narrow score gap alone must never authorize Competition.
    - Add configurable family sample threshold, allowed Competition triggers, and default Competition candidate count. Preserve competitionOnUncertainty only as a compatibility master switch, not as a sufficient reason.
    - Expose the same canonical read-only decision through Task parsing, Daemon, CLI, MCP, Hub Models, and Task Detail.
    - Render explanation-first bilingual copy for unknown, recommendation, Main selection, no-Competition, and reasoned consider/required states. Put internal identity, sample details, scores, and reason codes in a disclosure.
    - Add behavior tests for schema compatibility, immutable snapshots, exact-to-family evidence fallback, settings, all transport surfaces, and the Hub acceptance matrix.
  outOfScope:
    - Creating or running a real Competition, mixed-runtime candidate creation, Competition final result decisions, retained-partial handoff, automatic Worker selection, or automatic Integration.
    - Direct Codex calibration changes, pricing changes, Provider authentication, Worker runtime behavior, model prompts, retries, adaptation, or changing historical records.
    - Guessing a taskFamily from Task name or Prompt, mixing exact and family evidence inside one candidate ranking, or treating missing evidence as zero.
    - Adding a universal default model, permanently penalizing a model, tuning thresholds by repeated live retries, or launching any external model from tests.
  executionSteps:
    - Read both M3 V1 design documents and trace Task parsing, Worker Profile resolution, statistics, routing, settings, Daemon/CLI/MCP, Hub Models, and Task Detail before editing.
    - Define one canonical frozen Worker identity and one bounded routing-decision snapshot used by every producer and consumer.
    - Preserve exact taskClass behavior, then add explicit family evidence as a complete-set fallback; stop at unknown when either scope lacks comparable coverage for every shortlisted identity.
    - Separate the evidence conclusion from Competition intent and triggers. Prove unknown plus intent none returns no Competition suggestion.
    - Keep settings configurable for future Tasks and snapshots immutable for existing Tasks.
    - Implement explanation-first Hub output from canonical data rather than recomputing Main intent in JavaScript.
    - Run the focused acceptance suite once, repair only failures caused by this Candidate, then run full tests/build/diff hygiene once. Stop after one Candidate and return remaining gaps to Main.
  deliverables:
    - Backward-compatible Task family and Main routing-decision snapshot.
    - Exact-to-family-to-unknown comparable evidence and reason-gated Competition advice.
    - Configurable settings and identical Daemon, CLI, MCP, and Hub meaning.
    - Bilingual explanation-first Models and Task Detail presentation with executable regression coverage.
  modules:
    - name: Task decision contract
      responsibility: Validate and freeze Main's classification, shortlist, selection, reason, Competition intent, and evidence snapshot.
      consumes:
        - Explicit Task input, resolved Worker Profiles, current settings, and read-only routing result.
      produces:
        - Immutable optional taskFamily and routingDecision stored with the Task.
      boundaries:
        - Legacy Tasks remain readable; no inference, backfill, Provider call, or settings mutation.
    - name: Comparable evidence and advice
      responsibility: Compare one complete evidence scope and keep knowledge separate from Competition value.
      consumes:
        - Terminal Task evidence grouped by frozen Worker identity, exact taskClass, optional taskFamily, and current routing preferences.
      produces:
        - recommendation or unknown, exact/family/none scope, sample counts, omitted evidence, and reason-gated Competition advice.
      boundaries:
        - No mixed evidence scope, automatic launch, permanent blacklist, or fabricated score.
    - name: Decision surfaces
      responsibility: Carry and explain the canonical decision consistently across every Main and user surface.
      consumes:
        - Stored routingDecision and current read-only advisory.
      produces:
        - CLI/MCP/Daemon data plus bilingual Models and Task Detail explanation.
      boundaries:
        - Main may override advice; internal fields stay secondary to plain-language input, reason, result, and next action.
  callChain:
    - Main states taskClass, optional taskFamily, reasonable Worker shortlist, selection reason, and Competition intent.
    - Worker Profile resolution freezes each candidate's provider, model, runtime, effort, and provenance.
    - Statistics checks complete exact evidence, then complete family evidence, otherwise returns unknown.
    - Competition policy consumes explicit intent, triggers, and enabled settings independently from evidence uncertainty.
    - Task creation persists the exact decision snapshot before any Worker starts.
    - Daemon, CLI, MCP, Hub Models, and Task Detail consume the same snapshot and advisory without recomputing intent.
  scenarios:
    - name: Unknown does not spend twice
      given: Every shortlisted Worker has zero exact and family samples and Main sets intent none.
      when: Routing is evaluated and the Task is previewed.
      then: Knowledge is unknown, evidence scope is none, shouldRunCompetition is false, and Hub explains why Main chose one Worker without suggesting Competition.
    - name: Exact evidence wins
      given: Every shortlisted identity has enough comparable exact taskClass samples.
      when: Routing is evaluated.
      then: Only exact evidence determines the recommendation and family records do not enter the score.
    - name: Family evidence is a complete fallback
      given: Exact evidence is insufficient while every shortlisted identity has enough samples in the explicit taskFamily.
      when: Routing is evaluated.
      then: The result uses only family evidence and tells the user which broader history was used.
    - name: Critical work can justify a second opinion
      given: Routing has a recommendation and Main marks intent consider with trigger critical while the trigger is enabled.
      when: The decision is previewed.
      then: Competition advice is true because of criticality, not because evidence was described as unknown.
    - name: Historical identity does not drift
      given: A Task was created from a Worker Profile and that Profile is edited later.
      when: Task Detail and statistics read the historical Task.
      then: They use the frozen provider/model/runtime/effort and show the Profile only as its original source.
    - name: Legacy Task remains honest
      given: An old Task has neither taskFamily nor routingDecision.
      when: It is read or included in statistics.
      then: It keeps exact-class compatibility and reports missing decision evidence rather than inventing a family or Main reason.
  risks:
    - A partial schema rollout could let transports disagree, so one canonical parser and projection must be covered end to end.
    - Family aggregation can create false confidence, so family is explicit, complete-set only, and forbidden from exact-pair Token claims.
    - A settings toggle could silently rewrite history, so the Task stores the resolved decision while current advice is shown separately.
    - UI text can still imply automatic authority, so DOM assertions must prove unknown/no-Competition and machine-advice/Main-override wording in both languages.
  changeBudget:
    maxFiles: 20
    maxDiffLines: 2400

provider:
  name: deepseek
  model: deepseek-v4-pro[1M]
  endpoint: https://api.deepseek.com/anthropic
  keychainService: forklight.deepseek.api-key
runtime:
  name: claude-code
  executable: claude
  effort: high
  maxBudgetUsd: null
advancedPolicyOverride:
  maxDurationMs: null
  observedTokenCeiling: null
  noProgressTimeoutMs: 1800000
  workerStopGraceMs: 10000
  fileLimit: null
  fileLimitMode: warn
  changedLineLimit: null
  changedLineLimitMode: warn
  baseMaxAttempts: 1
  maxExtraAttempts: 0
  maxMainCorrections: 1
  maxMainReverifications: 1
  maxConcurrency: 1
  completionMode: warn
  changeBudgetMode: warn
  maxAdaptationRounds: 0
completionPolicy:
  noChangeMode: hard
  changeBudgetMode: warn
workspace:
  exclude:
    - .git
    - node_modules
    - dist
    - .forklight-dev
    - .forklight-daemon-test
  generatedPaths:
    - dist/**
worker:
  allowEdits: true
  allowedCommands: []
  focusPaths:
    - src/core
    - src/daemon
    - src/mcp
    - src/cli.ts
    - src/hub
    - tests/model-routing.test.ts
    - tests/statistics.test.ts
    - tests/task.test.ts
acceptance:
  criteria:
    - Unknown evidence and Competition intent are separate; unknown plus intent none never suggests or starts Competition.
    - Exact evidence, family fallback, and unknown are complete-set scopes grouped by frozen provider/model/runtime/effort identity and never mixed in one ranking.
    - Every new decision snapshot matches the Task's resolved Worker, preserves a bounded Main reason, and remains unchanged after settings edits; legacy Tasks remain readable without inference.
    - Family evidence never changes exact taskClass audit or Direct Codex Token calibration semantics.
    - Settings are configurable, all transport surfaces agree, and Models/Task Detail explain selection and non-Competition in plain English and Chinese.
    - No Worker launch, Competition submission, automatic retry, adaptation, Integration, commit, or push authority is added.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/task.test.ts tests/worker-profiles.test.ts tests/statistics.test.ts tests/model-routing.test.ts tests/settings.test.ts tests/daemon.test.ts tests/mcp.test.ts tests/hub-settings.test.ts tests/hub-ui-assets.test.ts
    - npm test
    - npm run build
    - node --check src/hub/public/app.js && node --check src/hub/public/i18n.js
    - git diff --check
deliveryProfileId: forklight-self-upgrade

acceptance:
  criteria:
    - The report gives one explicit graduate or not-graduate verdict against the current M1 exit rule.
    - Every old G1-G5 gap is either closed with current evidence or remains one concrete blocking gap.
    - Coding and non-Coding real flows are both accounted for without claiming Main Token savings.
    - M2-M5 work is separated from M1 blockers and no Hub work is proposed before the boundary.
    - Only the existing audit report changes.
  commands:
    - test -f goals/archive/forklight-main-token-leverage-m1/evidence/m1-cli-api-gap-audit.md
    - rg -q 'Verdict|结论' goals/archive/forklight-main-token-leverage-m1/evidence/m1-cli-api-gap-audit.md && rg -q 'G1|G2|G3|G4|G5' goals/archive/forklight-main-token-leverage-m1/evidence/m1-cli-api-gap-audit.md
    - git diff --check

version: 2
name: Make Hub Task submission preview tell one clear story
project: ../..
taskClass: m3-task-submit-preview-information-hierarchy
taskFamily: hub-product-comprehension
directCodexProfileId: codex-cli-gpt-5.6-sol-xhigh
workerProfileId: deepseek-flash-1m
routingDecision:
  taskFamily: hub-product-comprehension
  shortlist:
    - provider: deepseek
      model: deepseek-v4-flash[1M]
      runtime: claude-code
      effort: high
      workerProfileId: deepseek-flash-1m
    - provider: deepseek
      model: deepseek-v4-pro[1M]
      runtime: claude-code

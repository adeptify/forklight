    - Child exit and readiness timeout are bounded, truthful, privacy-safe, and do not auto-relaunch.
    - Existing daemon start/restart behavior and observation-only Integration commands remain correct.
    - The accepted change completes a full automatic four-stage self-upgrade under the updated bounded delivery profile.

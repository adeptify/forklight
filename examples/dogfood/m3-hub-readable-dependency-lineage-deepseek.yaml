acceptance:
  criteria:
    - Plan cards explain ready, waiting, blocked-by-failure, completed, and failed positions with names rather than raw item IDs.
    - Named direct dependents explain what each item unlocks, with bounded summarization for more than three relationships.
    - Task Detail conditionally explains Plan origin and existing handoff lineage, while standalone Tasks gain no empty section.
    - Handoff successors are continuations rather than retries, and retained work is never relabelled as accepted output.
    - Relationships come only from durable Store/event evidence, remain bounded/privacy-safe, and fail closed on malformed or missing records.
    - Existing actions, lanes, filters, scheduling, CLI/MCP consumers, four-part Task truth, themes, and responsive shell remain unchanged.
    - Chinese and English behavior tests prove readable copy and keep raw UUID/event-code text out of primary explanations.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/board.test.ts tests/hub-settings.test.ts tests/hub-ui-assets.test.ts
    - npm run check
    - npm run build
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - git diff --check

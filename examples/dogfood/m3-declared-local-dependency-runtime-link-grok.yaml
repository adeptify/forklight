    - src/workspace/copy.ts
    - src/core/integration-verification-copy.ts
    - tests/workspace.test.ts
acceptance:
  criteria:
    - "An exact declared file:/link: package symlink in node_modules is rewritten only to its mirror inside the owned isolation container."
    - Package name and resolved target must both match; undeclared, wrong-target and nested escaping links still fail closed.
    - Initial prepare, retained Candidate reverify and Integration/Main-remediation verification use the same behavior.
    - Source packages remain immutable and dependency mirrors never enter the Candidate patch.
    - No external project, runtime process, credential, database, commit or push is changed.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/workspace.test.ts
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/integration.test.ts tests/integration-operation.test.ts
    - npm test
    - npm run build
    - git diff --check

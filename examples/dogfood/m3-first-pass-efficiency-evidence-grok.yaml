acceptance:
  criteria:
    - First-pass verified success uses only Attempt one and its own verification; later success or final delivery cannot rewrite it.
    - Missing and non-model first-Attempt outcomes stay unavailable instead of synthetic failure or zero.
    - Every candidate needs sufficient first-pass coverage before the factor scores; strict/flexible behavior remains truthful.
    - The independently configurable weight survives settings migration, validation, partial update, daemon snapshot, Hub edit, and resolved-policy display.
    - Hub explains first-pass success separately from eventual delivery and correction effort in English and Chinese.
    - Full Worker identity zero-evidence rows retain the candidate provider/model and no response exposes private Task evidence.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/statistics.test.ts tests/model-routing.test.ts tests/settings.test.ts tests/hub-settings.test.ts tests/hub-ui-assets.test.ts
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - npm run check
    - git diff --check

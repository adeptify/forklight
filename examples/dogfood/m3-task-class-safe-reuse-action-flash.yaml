acceptance:
  criteria:
    - A confirmed operation can change only root taskClass to an exact current same-family classChoice and returns a fresh canonical preview without creating a Task.
    - Stale, forged, repeated, concurrent and unsafe-path requests fail before destructive write and preserve the real file.
    - YAML comments, JSON format, file permissions and every non-taskClass parsed field remain unchanged; ordinary failures clean temporary artifacts.
    - Daemon owns authority and Hub never trusts or recomputes eligibility, counts, digest or file success.
    - Hub actions are bilingual, accessible, pending-safe, invalidate stale submit state, and never auto-submit or start a Worker.
    - Existing preview, submission, routing, Competition, Settings, Task lifecycle, Integration and economics behavior remain unchanged.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/task-class-reuse.test.ts tests/daemon.test.ts tests/hub-ops-mutations.test.ts tests/hub-ui-assets.test.ts
    - npm test
    - npm run build
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - git diff --check
deliveryProfileId: forklight-self-upgrade

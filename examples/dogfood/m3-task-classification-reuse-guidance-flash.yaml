    - .git
    - node_modules
    - dist
    - target
    - .forklight-dev
    - .forklight-daemon-test
  generatedPaths:
    - dist/**
worker:
  allowEdits: true
  allowedCommands: []
  focusPaths:
    - src/core
    - src/daemon
    - src/cli.ts
    - src/mcp/server.ts
    - src/hub
    - tests
acceptance:
  criteria:
    - Preview classifies taskClass and taskFamily as missing, new, or existing using only terminal ordinary Tasks and truthful complete-selection counts.
    - Existing family choices are bounded to eight, deterministically ordered, detached, and contain no Task identity or private content.
    - CLI validate and daemon/MCP validate_file share one classification meaning; Hub only renders the safe projection.
    - Classification history never enters previewRevisionDigest, never stales submission by itself, and never mutates Task files, Tasks, Settings, or execution.
    - Hub explains reuse, new-family, and missing-family states bilingually without auto-selection, model ranking, or Competition advice.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/task-preview.test.ts tests/statistics.test.ts tests/daemon.test.ts tests/daemon-cli.test.ts tests/mcp.test.ts tests/hub-ops-mutations.test.ts tests/hub-ui-assets.test.ts
    - npm test
    - npm run build
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - git diff --check
deliveryProfileId: forklight-self-upgrade

acceptance:
  criteria:
    - classChoices contains at most eight eligible terminal ordinary classes from only the explicitly selected existing family, with truthful counts and deterministic ordering.
    - The projection is detached, deeply frozen, privacy-safe and absent from previewRevisionDigest, with no mutation or lifecycle side effect.
    - CLI, daemon/MCP and Hub consume the same canonical meaning; Hub does not recompute counts or semantic fit.
    - Hub shows plain bilingual class choices only for missing/new class plus existing family, keeps Main as the decision maker and preserves the current preview hierarchy.
    - Existing submission, routing, Competition, Settings, Integration and economics behavior remain unchanged.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/statistics.test.ts tests/task-preview.test.ts tests/daemon.test.ts tests/hub-ui-assets.test.ts
    - npm test
    - npm run build
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - git diff --check

acceptance:
  criteria:
    - Routine daemon, CLI JSON, MCP, and Hub statistics preserve every aggregate fact while omitting row-level failures, ids, and diagnostics.
    - Explicit CLI/MCP deep audit returns the existing full evidence and invalid detail values fail closed.
    - Human CLI output, routing evidence, stored history, and all model-selection calculations remain unchanged.
  commands:

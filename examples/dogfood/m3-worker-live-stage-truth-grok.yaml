acceptance:
  criteria:
    - The canonical stage distinguishes preparation, waiting for model, model response, tool use, verification, quiet observation, and explicit terminal evidence without prose inference.
    - Claude-compatible and Grok histories project equivalent meanings from normalized structured evidence.
    - Quiet never means failed or starts a retry; stopped wording requires durable terminal or policy evidence.
    - CLI/daemon/list/Task Detail/board consume the same bounded projection, with honest bilingual copy and legacy fallback.
    - Public stage data contains no prompt, response content, tool arguments, paths, endpoints, credentials, command text/output, raw error, ETA, or invented percentage.
    - Focused tests, full check, build, JavaScript syntax, and diff validation pass.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/task-surface.test.ts tests/task-decision-view.test.ts tests/worker-runtime.test.ts tests/grok-worker-runtime.test.ts tests/hub-ui-assets.test.ts
    - npm run check
    - npm run build
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - git diff --check

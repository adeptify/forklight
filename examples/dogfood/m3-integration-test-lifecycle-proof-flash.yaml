worker:
  allowEdits: true
  allowedCommands: []
  focusPaths:
    - tests/integration-operation.test.ts
    - tests/daemon-cli.test.ts
    - tests/helpers/detached-daemon.ts
    - tests/detached-daemon-fixture.test.ts
acceptance:
  criteria:
    - Detached activation tests keep one operation and wait for durable terminality before exact-home daemon close on success, failure, delay, or thrown assertion.
    - Fresh-home Integration observers and completed waits are judged by no-mutation evidence, never scheduler-sensitive elapsed thresholds.
    - No public Integration response, CLI output, or source type contains runnerPid or another temporary runner identity.
    - Tests scan no process names, signal no untracked PID, start no second Integration, and touch no user home.
    - Full tests, build, and diff hygiene pass without retry or reduced concurrency.
  commands:
    - for i in 1 2 3; do node --disable-warning=ExperimentalWarning --test --import tsx --test-name-pattern='detached activation completes|integration starts non-blocking|Integration status/wait/history on a fresh home|Integration status/history/wait succeed' tests/integration-operation.test.ts tests/daemon-cli.test.ts || exit 1; done
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/activation.test.ts tests/integration-operation.test.ts tests/detached-daemon-fixture.test.ts tests/daemon-cli.test.ts
    - npm test
    - npm run build
    - git diff --check

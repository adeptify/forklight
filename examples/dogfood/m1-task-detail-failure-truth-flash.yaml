  allowedCommands: []
  focusPaths:
    - src/hub/server.ts
    - src/hub/public/app.js
    - src/hub/public/i18n.js
    - tests/hub-settings.test.ts
    - tests/hub-ui-assets.test.ts
acceptance:
  criteria:
    - Failed command summaries prefer privacy-safe failure diagnostics and never present explicit passing lines as the failure cause.
    - Check names are result-neutral in both locales; verdicts, Main decisions and next actions remain logically consistent.
    - Rejected or revision-required Tasks state that no automatic retry or Integration will occur and name the Main decision needed to continue.
    - Existing redaction, bounds, safe projection and successful corrected/integrated journey behavior do not regress.
  commands:
    - node --disable-warning=ExperimentalWarning --test --import tsx tests/hub-settings.test.ts tests/hub-ui-assets.test.ts
    - npm test
    - npm run build
    - node --check src/hub/public/app.js
    - node --check src/hub/public/i18n.js
    - git diff --check

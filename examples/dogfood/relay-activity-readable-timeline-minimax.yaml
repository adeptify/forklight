workspace:
  exclude:
    - .git
    - node_modules
    - .next
    - dist
  generatedPaths:
    - .next/**
worker:
  allowEdits: true
  allowedCommands: []
  focusPaths:
    - src/app/activity/page.tsx
    - src/components/activity-presentation.ts
    - tests/activity-presentation.test.ts
acceptance:
  criteria:
    - Every Activity event kind currently emitted by Relay receives a bounded Chinese category label; unrecognized kinds use a neutral fallback and raw dotted identifiers are not primary UI copy.
    - All five Job statuses receive truthful user-facing stages and explanations, with success limited to Worker execution and failure never inventing a cause.
    - The page uses the pure presentation output, retains authoritative event text, and shows clear empty states without changing store/API/domain behavior.
    - Focused behavior tests cover all current Job statuses, representative recognized event kinds, unrecognized kinds, missing Item/Runtime records, and forbidden final-delivery wording.
    - The focused test, the existing complete 151-test baseline, and diff hygiene pass; existing ESLint compatibility and optional Postgres TypeScript baselines are not expanded into this Task.
  commands:
    - node --test --import tsx tests/activity-presentation.test.ts
    - npm test
    - git diff --check

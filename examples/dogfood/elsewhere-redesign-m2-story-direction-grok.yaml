acceptance:
  criteria:
    - Only explicitly relevant, official sourced world items may reach planning or generation; unreviewed, rejected, incorrect, stale, or invented IDs fail closed.
    - StoryDirective is one bounded, traceable possibility with explicit unknowns and forbidden outcomes, never a prediction or personal success claim.
    - Private, unavailable, atmosphere-only, and all-rejected paths produce honest personal-only directions and remain generatable.
    - Exact-basis caching, disposition invalidation, Provider failure/cancel recovery, AI run persistence, and legacy schema-v1 generation are deterministic.
    - Focused contracts/workflow/adapter/Demo tests, complete Elsewhere check, production build, and diff hygiene pass from the current 175-test baseline.
  commands:
    - pnpm vitest run tests/services/journey-ai-contracts.test.ts tests/services/journey-ai-contract-validation.test.ts tests/services/journey-workflow.test.ts tests/core-adapter/core-product-journey-ai.test.ts tests/demo/create-demo-runtime.test.ts
    - pnpm check
    - pnpm build
    - git diff --check
